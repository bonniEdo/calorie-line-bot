<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>飲控打卡｜GitHub Pages 測試</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="api.js"></script>
</head>
<body>
<main class="app">
  <header class="hero">
    <div class="eyebrow">HEALTH LOG · GITHUB PAGES TEST</div>
    <h1>飲控打卡緊迫盯人</h1>
    <p>畫面放在 GitHub Pages，資料仍由 Apps Script 從 Google Sheet 提供。這一階段先做唯讀安全測試。</p>
    <div class="summary">
      <div class="summary-card"><strong>前端</strong><span>GitHub Pages</span></div>
      <div class="summary-card"><strong>資料</strong><span>Apps Script API</span></div>
      <div class="summary-card"><strong>登入</strong><span>LIFF 下一階段</span></div>
    </div>
  </header>

  <nav class="nav">
    <a href="index.html">📝 我要打卡</a>
    <a href="public.html">🌍 公開紀錄牆</a>
    <a href="history.html">📈 卡路里歷史</a>
  </nav>

  <section class="panel">
    <div class="panel-head"><h2>連接測試資料</h2><span class="badge">API 唯讀</span></div>
    <p class="hint">Apps Script 請填正式部署的 <code>/exec</code> 網址，不要填 `/dev`。測試專案可勾選 test=1。</p>
    <div class="setup-grid">
      <label>Apps Script API URL<input id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec"></label>
      <button class="btn primary" id="saveApi">儲存</button>
    </div>
    <div class="setup-grid">
      <label>簽章網址（從 LINE 的打卡連結貼上）<input id="signedUrl" placeholder="https://.../exec?uid=...&sig=..."></label>
      <button class="btn" id="saveCreds">記住憑證</button>
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--ink);"><input id="testMode" type="checkbox" style="width:18px;min-height:18px;margin:0"> 測試環境使用 <code>?test=1</code></label>
    <div id="setupStatus" class="status"></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>📝 本人打卡資料</h2><span id="dateStatus" class="badge progress">尚未讀取</span></div>
    <div class="toolbar">
      <label>日期<select id="dateSelect"></select></label>
      <button class="btn green" id="loadForm">讀取資料</button>
    </div>
    <div id="formView" class="loading">先設定 API 與簽章網址，再讀取本人資料。</div>
  </section>
</main>
<script>
  const $ = id => document.getElementById(id);
  const api = window.HealthLogApi;
  let credentials = api.credentialsFromStorage();
  const dates = [];

  function dateKey(offset) {
    const d = new Date(); d.setDate(d.getDate() - offset);
    return d.toISOString().slice(0, 10);
  }
  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function setupInputs() {
    $('apiUrl').value = api.configuredApiUrl();
    $('signedUrl').value = credentials.uid && credentials.sig ? `${api.configuredApiUrl()}?uid=${encodeURIComponent(credentials.uid)}&sig=${encodeURIComponent(credentials.sig)}` : '';
    for (let i = 0; i < 4; i += 1) {
      const date = dateKey(i); dates.push(date);
      const option = document.createElement('option'); option.value = date; option.textContent = i === 0 ? `今天（${date}）` : i === 1 ? `昨天（${date}）` : `前${i}天（${date}）`; $('dateSelect').appendChild(option);
    }
  }
  function saveApi() {
    const value = api.saveApiUrl($('apiUrl').value); $('apiUrl').value = value;
    $('setupStatus').textContent = value ? 'API 網址已儲存。' : '請輸入 /exec 網址。'; $('setupStatus').className = value ? 'status ok' : 'status error';
  }
  function saveCreds() {
    credentials = api.saveCredentials($('signedUrl').value);
    $('setupStatus').textContent = credentials.uid && credentials.sig ? '簽章憑證已記住。' : '找不到 uid/sig，請貼完整的打卡連結。';
    $('setupStatus').className = credentials.uid && credentials.sig ? 'status ok' : 'status error';
  }
  function mealHtml(log) {
    const meals = log && log.meals ? log.meals : {};
    const aiMeals = log && log.aiMeals ? log.aiMeals : {};
    const labels = [['breakfast','早餐'],['lunch','午餐'],['dinner','晚餐'],['lateNight','宵夜'],['snack','點心']];
    return `<div class="meal-grid">${labels.map(([key,label]) => { const items = Array.isArray(meals[key]) ? meals[key] : []; const aiItems = Array.isArray(aiMeals[key]) ? aiMeals[key] : []; const all = items.concat(aiItems); const kcal = aiItems.reduce((sum,item) => sum + Number(item.calories || 0), 0); return `<div class="meal"><strong>${label} · ${Math.round(kcal)} kcal</strong>${all.length ? `<ul>${all.map(item => `<li>${esc(item.name || '食物')} · ${Math.round(item.calories || 0)} kcal</li>`).join('')}</ul>` : '<span>尚未記錄</span>'}</div>`; }).join('')}</div>`;
  }
  function renderForm(data) {
    const log = data && data.log;
    if (!log) { $('formView').innerHTML = '<div class="empty">這一天還沒有紀錄。</div>'; return; }
    const member = data.member || {};
    const summary = data.summary || {};
    const intake = Number(summary.intake || 0);
    const tdee = Number(summary.tdee || 0);
    const status = log.isComplete ? '已完成' : '打卡中';
    $('dateStatus').textContent = status;
    $('dateStatus').className = log.isComplete ? 'badge' : 'badge progress';
    $('formView').innerHTML = `<div class="cards"><div class="metric"><span>今日攝取</span><strong>${Math.round(intake)} kcal</strong><small>${esc(member.name || '')}</small></div><div class="metric"><span>今日可攝取總量（TDEE）</span><strong>${Math.round(tdee)} kcal</strong><small>BMR ${Math.round(summary.bmr || member.bmr || 0)} × 1.2 ＋ 運動 ${Math.round(summary.exerciseKcal || log.exerciseKcal || 0)}</small></div></div>${mealHtml(log)}<div class="cards"><div class="metric"><span>💧 飲水</span><strong>${Math.round(log.waterMl || 0)} ml</strong><small>${log.waterGoalMl ? `目標 ${Math.round(log.waterGoalMl)} ml` : '未啟用'}</small></div><div class="metric"><span>🏋️ 運動</span><strong>${Math.round(log.exerciseKcal || 0)} kcal</strong><small>${esc(log.exerciseName || '尚未記錄')} · ${Math.round(log.exerciseMinutes || 0)} 分鐘</small></div></div><div class="panel" style="margin:12px 0 0;background:var(--blue-soft);border-color:#b6dcea"><strong>想修改資料？</strong><p class="hint">目前 GitHub Pages 是安全唯讀版；請按下方連結回 Apps Script 打卡頁編輯。</p>${credentials.uid && credentials.sig ? `<a class="btn link primary" style="margin-top:10px" target="_blank" href="${api.configuredApiUrl()}?uid=${encodeURIComponent(credentials.uid)}&sig=${encodeURIComponent(credentials.sig)}">開啟可編輯打卡頁</a>` : ''}</div>`;
  }
  async function loadForm() {
    $('formView').innerHTML = '<div class="loading">正在讀取 Apps Script…</div>';
    try {
      const params = { date: $('dateSelect').value };
      if ($('testMode').checked) params.test = '1'; else { params.uid = credentials.uid; params.sig = credentials.sig; }
      const result = await api.get('form', params); renderForm(result.data && result.data.log ? result.data : result.data);
    } catch (error) { $('dateStatus').textContent = '讀取失敗'; $('dateStatus').className = 'badge progress'; $('formView').innerHTML = `<div class="empty">${esc(error.message)}<br><small>確認 API 是 /exec、測試模式已執行 enableTestWebAccess，或簽章連結尚未過期。</small></div>`; }
  }
  $('saveApi').addEventListener('click', saveApi); $('saveCreds').addEventListener('click', saveCreds); $('loadForm').addEventListener('click', loadForm); setupInputs();
</script>
</body>
</html>
