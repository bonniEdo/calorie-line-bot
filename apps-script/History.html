<!doctype html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>卡路里歷史紀錄</title>
  <style>
    :root { --cream:#fffaf0; --ink:#332f29; --muted:#776f64; --line:#eadfca; --yellow:#f5d77a; --green:#4e8b69; --red:#c65f55; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--cream); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; }
    .app { max-width:720px; margin:0 auto; padding:16px 14px 40px; }
    .hero { padding:20px; border-radius:24px; background:linear-gradient(135deg,#ffe9a8,#f6d76e); box-shadow:0 10px 30px rgba(85,65,28,.1); }
    .eyebrow { color:#765c17; font-size:12px; font-weight:900; letter-spacing:.12em; }
    h1 { margin:7px 0 4px; font-size:27px; }
    .hero p { margin:0; color:#6b571f; font-size:13px; }
    .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
    .summary-card { padding:11px 9px; border-radius:15px; background:rgba(255,255,255,.78); text-align:center; }
    .summary-card strong { display:block; font-size:20px; }
    .summary-card span { color:#765c17; font-size:11px; font-weight:800; }
    .page-nav { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:7px; margin-top:12px; }
    .page-nav a, .page-nav button { min-height:42px; display:flex; align-items:center; justify-content:center; padding:8px 7px; border:1px solid #8bc9e8; border-radius:12px; background:#e8f6ff; color:#245f7d; font:inherit; font-size:12px; font-weight:900; text-decoration:none; cursor:pointer; }
    .page-nav .page-nav-primary { border-color:#8bc9e8; background:#e8f6ff; color:#245f7d; }
    .page-nav button { border-color:#8bc9e8; background:#e8f6ff; color:#245f7d; }
    .section { margin-top:16px; padding:16px; border:1px solid var(--line); border-radius:20px; background:#fff; box-shadow:0 6px 18px rgba(85,65,28,.05); }
    .section h2 { margin:0 0 6px; font-size:18px; }
    .section-head { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .section-head h2 { margin:0; }
    .chart-wrap { margin-top:13px; padding:10px 4px 2px; overflow:hidden; border-radius:16px; background:#fffaf0; }
    .chart-svg { display:block; width:100%; height:auto; min-height:230px; }
    .chart-grid { stroke:#eadfca; stroke-width:1; stroke-dasharray:3 4; }
    .chart-axis { fill:#9a8d7a; font-size:10px; }
    .chart-line-intake { fill:none; stroke:#e59a32; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
    .chart-line-tdee { fill:none; stroke:#4e8b69; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
    .chart-dot-intake { fill:#fff; stroke:#e59a32; stroke-width:2; }
    .chart-water { pointer-events:none; }
    .chart-water-outline { fill:#fffaf0; stroke:#a8977d; stroke-width:1.35; stroke-linejoin:round; }
    .chart-water-fill { fill:#67b4d7; opacity:.92; }
    .chart-water.half .chart-water-outline { stroke:#377b99; }
    .chart-water.full .chart-water-outline { stroke:#267246; }
    .chart-dot-tdee { fill:#fff; stroke:#4e8b69; stroke-width:2; }
    .chart-legend { display:flex; justify-content:center; gap:18px; margin-top:8px; color:var(--muted); font-size:12px; font-weight:800; }
    .legend-item { display:inline-flex; align-items:center; gap:5px; }
    .legend-dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
    .legend-intake { background:#e59a32; }
    .legend-tdee { background:#4e8b69; }
    .chart-empty { padding:38px 10px; text-align:center; color:var(--muted); }
    .period-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:12px; }
    .period-card { overflow:hidden; border:1px solid var(--line); border-radius:16px; background:#fffaf0; }
    .period-card > summary { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 13px; color:#765c17; font-size:13px; font-weight:900; cursor:pointer; list-style:none; }
    .period-card > summary::-webkit-details-marker { display:none; }
    .period-card > summary::after { content:'＋'; font-size:16px; }
    .period-card[open] > summary::after { content:'－'; }
    .period-list { padding:0 12px 11px; }
    .period-row { padding:10px 0; border-top:1px solid var(--line); }
    .period-row:first-child { border-top:0; }
    .period-label { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; font-weight:900; }
    .period-label small { color:var(--muted); font-size:10px; font-weight:700; }
    /* 週／月改成一行「進食／可消耗」加上視覺進度，不再分裂成兩張小卡。 */
    .period-energy { margin-top:8px; padding:9px 10px; border-radius:11px; background:#fff; }
    .period-energy-top { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
    .period-energy-top strong { color:#35684b; font-size:14px; }
    .period-energy-top span { color:#4e8b69; font-size:10px; font-weight:900; white-space:nowrap; }
    .period-energy-label { display:block; margin-top:6px; color:var(--muted); font-size:10px; font-weight:800; }
    .period-bar { height:7px; margin-top:7px; overflow:hidden; border-radius:999px; background:#e6f0e8; }
    .period-bar > span { display:block; height:100%; border-radius:inherit; background:#4e8b69; transition:width .2s ease; }
    .period-energy.over .period-energy-top strong,
    .period-energy.over .period-energy-top span { color:#b87318; }
    .period-energy.over .period-bar { background:#fff0d7; }
    .period-energy.over .period-bar > span { background:#e59a32; }
    .hint { margin:0; color:var(--muted); font-size:12px; line-height:1.5; }
    .record { border-top:1px solid var(--line); padding:13px 0 0; margin-top:13px; }
    .record:first-child { border-top:0; margin-top:0; padding-top:0; }
    .record summary { display:grid; grid-template-columns:112px minmax(0,1fr) auto; gap:8px; align-items:center; cursor:pointer; list-style:none; }
    .record summary::-webkit-details-marker { display:none; }
    .history-more { margin-top:14px; border-top:1px dashed var(--line); padding-top:12px; }
    .history-more > summary { color:#765c17; font-size:13px; font-weight:900; cursor:pointer; }
    .date { display:flex; flex-direction:column; align-items:flex-start; gap:4px; color:var(--muted); font-size:13px; font-weight:800; }
    .energy { min-width:0; }
    .energy strong { font-size:17px; }
    .energy small { display:block; color:var(--muted); font-size:11px; }
    .status { padding:4px 8px; border-radius:999px; background:#e5f2e8; color:#35684b; font-size:11px; font-weight:900; white-space:nowrap; }
    .status.progress { background:#fff4d4; color:#765c17; }
    .detail { margin:12px 0 0 120px; padding:11px 12px; border-radius:14px; background:#fffaf0; }
    .detail-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; }
    .detail-item { color:var(--muted); font-size:12px; }
    .detail-item strong { display:block; color:var(--ink); font-size:14px; }
    .meal-list { margin:10px 0 0; padding-top:9px; border-top:1px dashed var(--line); }
    .meal { display:flex; justify-content:space-between; gap:8px; padding:3px 0; font-size:12px; }
    .meal span:last-child { font-weight:900; }
    .empty, .error { padding:22px 10px; text-align:center; color:var(--muted); line-height:1.6; }
    .error { color:var(--red); }
    @media (max-width:520px) { .period-grid { grid-template-columns:1fr; } }
    @media (max-width:420px) { .summary-card strong { font-size:17px; } .record summary { grid-template-columns:96px minmax(0,1fr) auto; gap:6px; } .detail { margin-left:0; } }
  </style>
</head>
<body>
  <main class="app" id="app"><div class="empty">正在載入歷史紀錄…</div></main>
  <div id="historyData" hidden><?= historyJson ?></div>
  <script>
    (function () {
      const root = document.getElementById('app');
      let data;
      try { data = JSON.parse(document.getElementById('historyData').textContent || '{}'); }
      catch (error) { root.innerHTML = '<div class="section error">歷史資料讀取失敗，請重新開啟。</div>'; return; }
      if (!data.valid) {
        root.innerHTML = '<div class="section error"><h2>歷史紀錄連結無效</h2><p>請回 LINE 重新輸入「打卡」取得新連結。</p></div>';
        return;
      }
      const number = value => Number(value || 0).toLocaleString('zh-TW');
      const dateLabel = value => {
        const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
        return match ? `${match[2]}/${match[3]}` : String(value || '');
      };
      const signed = value => value > 0 ? `+${number(value)}` : number(value);
      const records = Array.isArray(data.records) ? data.records : [];
      const summary = data.summary || {};
      const nav = data.nav || {};
      let html = '<section class="hero">'
        + '<div class="eyebrow">CALORIE HISTORY</div>'
        + '<h1>📊 卡路里歷史紀錄</h1>'
        + '<p>最近 ' + number(data.days || 30) + ' 天・只顯示自己的資料・平均值只計已完成日</p>'
        + '<div class="summary">'
        + '<div class="summary-card"><strong>' + number(summary.averageIntake) + '</strong><span>完成日平均攝取 kcal</span></div>'
        + '<div class="summary-card"><strong>' + number(summary.averageTdee) + '</strong><span>完成日平均 TDEE kcal</span></div>'
        + '<div class="summary-card"><strong>' + number(summary.completedDays) + '/' + number(summary.loggedDays) + '</strong><span>完成紀錄</span></div>'
        + '</div></section>'
        + '<nav class="page-nav" aria-label="頁面導覽">'
        + (nav.formUrl ? '<a class="page-nav-primary" href="' + escapeAttr(nav.formUrl) + '" target="_top">📝 我要打卡</a>' : '')
        + (nav.publicWallUrl ? '<a href="' + escapeAttr(nav.publicWallUrl) + '" target="_top">🌍 公開紀錄牆</a>' : '')
        + '</nav>';
      html += '<section class="section chart-section"><div class="section-head"><div><h2>📈 攝取趨勢</h2><p class="hint">折線圖顯示最近 30 筆記錄。</p></div></div>';
      if (!records.length) {
        html += '<div class="chart-empty">有紀錄後，這裡會顯示你的熱量趨勢圖。</div>';
      } else {
        html += buildTrendChart(records.slice(0, 30));
      }
      html += '</section>';
      if (records.length) {
          html += '<section class="section"><div class="section-head"><div><h2>🗓️ 週／月熱量總覽</h2><p class="hint">由每日紀錄加總・猛猛進食／可猛猛消耗。</p></div></div>'
          + '<div class="period-grid">'
          + renderPeriodCard('每週總計', aggregateByWeek(records), true)
          + renderPeriodCard('每月總計', aggregateByMonth(records), false)
          + '</div></section>';
      }
      html += '<section class="section"><div class="section-head"><div><h2>📅 我的歷史紀錄</h2><p class="hint">點開日期查看餐別、運動與飲水。</p></div></div>';
      if (!records.length) {
        html += '<div class="empty">目前還沒有歷史紀錄。</div>';
      } else {
        const recentRecords = records.slice(0, 3);
        const olderRecords = records.slice(3);
        html += recentRecords.map(renderRecord).join('');
        if (olderRecords.length) {
          html += '<details class="history-more"><summary>展開其餘 ' + number(olderRecords.length) + ' 筆歷史紀錄</summary>'
            + olderRecords.map(renderRecord).join('')
            + '</details>';
        }
      }
      html += '</section>';
      root.innerHTML = html;

      function escapeAttr(value) {
        return String(value || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function renderRecord(record) {
        const progress = record.status !== '完成';
        const waterMl = Math.max(0, Number(record.waterMl || 0));
        const waterGoalMl = Math.max(0, Number(record.waterGoalMl || 0));
        const waterTracked = Boolean(record.waterTracked && waterGoalMl > 0);
        let result = '<details class="record"><summary>'
          + '<span class="date"><strong>' + dateLabel(record.date) + '</strong></span>'
          + '<span class="energy"><strong>' + number(record.intake) + ' / ' + number(record.tdee) + ' kcal</strong><small>差額 ' + signed(record.deficit) + ' kcal</small></span>'
          + '<span class="status ' + (progress ? 'progress' : '') + '">' + (progress ? '打卡中' : '已完成') + '</span>'
          + '</summary><div class="detail"><div class="detail-grid">'
          + '<div class="detail-item"><strong>' + number(record.exerciseKcal) + ' kcal</strong>運動消耗</div>'
          + '<div class="detail-item"><strong>' + number(record.exerciseMinutes) + ' 分鐘</strong>運動時間</div>'
          + '<div class="detail-item"><strong>' + (waterTracked ? number(waterMl) + ' / ' + number(waterGoalMl) + ' ml' : '未啟用') + '</strong>飲水量</div>'
          + '<div class="detail-item"><strong>' + (record.exerciseName || '未填寫') + '</strong>運動項目</div>'
          + '</div><div class="meal-list">';
        (record.meals || []).forEach(meal => {
          result += '<div class="meal"><span>' + meal.label + (meal.names && meal.names.length ? '・' + meal.names.join('、') : '') + '</span><span>' + number(meal.kcal) + ' kcal</span></div>';
        });
        return result + '</div></div></details>';
      }

      function parseDateKey(value) {
        const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
        return match ? new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), 12) : null;
      }

      function dateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      function aggregateByWeek(items) {
        const groups = new Map();
        items.forEach(record => {
          const date = parseDateKey(record.date);
          if (!date) return;
          const monday = new Date(date);
          monday.setDate(date.getDate() - ((date.getDay() + 6) % 7));
          const sunday = new Date(monday);
          sunday.setDate(monday.getDate() + 6);
          const key = dateKey(monday);
          const group = groups.get(key) || {
            key,
            label: `${dateLabel(dateKey(monday))}－${dateLabel(dateKey(sunday))}`,
            intake: 0,
            tdee: 0,
            days: 0,
          };
          group.intake += Math.max(0, Number(record.intake || 0));
          group.tdee += Math.max(0, Number(record.tdee || 0));
          group.days += 1;
          groups.set(key, group);
        });
        return Array.from(groups.values());
      }

      function aggregateByMonth(items) {
        const groups = new Map();
        items.forEach(record => {
          const date = parseDateKey(record.date);
          if (!date) return;
          const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
          const group = groups.get(key) || {
            key,
            label: `${date.getFullYear()} 年 ${date.getMonth() + 1} 月`,
            intake: 0,
            tdee: 0,
            days: 0,
          };
          group.intake += Math.max(0, Number(record.intake || 0));
          group.tdee += Math.max(0, Number(record.tdee || 0));
          group.days += 1;
          groups.set(key, group);
        });
        return Array.from(groups.values());
      }

      function renderPeriodCard(title, periods, open) {
        const rows = periods.map(period => {
          const intake = Math.max(0, Math.round(Number(period.intake || 0)));
          const tdee = Math.max(0, Math.round(Number(period.tdee || 0)));
          const over = tdee > 0 && intake > tdee;
          const remaining = Math.max(0, tdee - intake);
          const exceeded = Math.max(0, intake - tdee);
          const width = tdee > 0 ? Math.min(100, Math.max(0, intake / tdee * 100)) : 0;
          return '<div class="period-row">'
            + '<div class="period-label"><span>' + period.label + '</span><small>' + number(period.days) + ' 個記錄日</small></div>'
            + '<div class="period-energy' + (over ? ' over' : '') + '">'
            + '<div class="period-energy-top"><strong>' + number(intake) + ' / ' + number(tdee) + ' kcal</strong>'
            + '<span>' + (over ? '超過 ' + number(exceeded) + ' kcal' : '還可 ' + number(remaining) + ' kcal') + '</span></div>'
            + '<div class="period-bar"><span style="width:' + width.toFixed(1) + '%"></span></div>'
            + '<small class="period-energy-label">猛猛進食／可猛猛消耗</small>'
            + '</div></div>';
        }).join('');
        return '<details class="period-card"' + (open ? ' open' : '') + '><summary>' + title + '</summary><div class="period-list">' + rows + '</div></details>';
      }

      function buildTrendChart(items) {
        const ordered = items.slice().reverse();
        const width = 680;
        const height = 300;
        const pad = { left: 44, right: 14, top: 18, bottom: 62 };
        const plotWidth = width - pad.left - pad.right;
        const plotHeight = height - pad.top - pad.bottom;
        const max = Math.max(100, ...ordered.map(item => Math.max(Number(item.intake) || 0, Number(item.tdee) || 0)));
        const x = index => ordered.length === 1
          ? pad.left + plotWidth / 2
          : pad.left + (plotWidth * index / (ordered.length - 1));
        const y = value => pad.top + plotHeight - (Math.max(0, Number(value) || 0) / max * plotHeight);
        const path = key => ordered.map((item, index) => `${index ? 'L' : 'M'}${x(index).toFixed(1)},${y(item[key]).toFixed(1)}`).join(' ');
        const grid = [0, .25, .5, .75, 1].map(ratio => {
          const value = Math.round(max * ratio);
          const lineY = y(value).toFixed(1);
          return '<line class="chart-grid" x1="' + pad.left + '" y1="' + lineY + '" x2="' + (width - pad.right) + '" y2="' + lineY + '" />'
            + '<text class="chart-axis" x="' + (pad.left - 7) + '" y="' + (Number(lineY) + 3) + '" text-anchor="end">' + number(value) + '</text>';
        }).join('');
        const dots = (key, klass) => ordered.map((item, index) => '<circle class="' + klass + '" cx="' + x(index).toFixed(1) + '" cy="' + y(item[key]).toFixed(1) + '" r="3.5" />').join('');
        const waterIcons = ordered.map((item, index) => {
          const show = ordered.length <= 10 || index === 0 || index === ordered.length - 1 || index % Math.ceil(ordered.length / 6) === 0;
          const waterMl = Math.max(0, Number(item.waterMl || 0));
          const waterGoalMl = Math.max(0, Number(item.waterGoalMl || 0));
          if (!show || !item.waterTracked || waterGoalMl <= 0) return '';
          const state = waterMl >= waterGoalMl ? 'full' : waterMl > 0 ? 'half' : 'empty';
          const label = state === 'full' ? '飲水達標' : state === 'half' ? '飲水未達標' : '尚未喝水';
          const top = height - 24;
          const fill = state === 'full'
            ? '<path class="chart-water-fill" d="M-5 1 H5 L4 14 H-4 Z" />'
            : state === 'half'
              ? '<path class="chart-water-fill" d="M-4.5 8 H4.5 L4 14 H-4 Z" />'
              : '';
          return '<g class="chart-water ' + state + '" transform="translate(' + x(index).toFixed(1) + ',' + top + ')" role="img" aria-label="' + label + '">'
            + '<path class="chart-water-outline" d="M-6 0 H6 L5 15 H-5 Z" />' + fill + '</g>';
        }).join('');
        const labels = ordered.map((item, index) => {
          const show = ordered.length <= 10 || index === 0 || index === ordered.length - 1 || index % Math.ceil(ordered.length / 6) === 0;
          return show ? '<text class="chart-axis" x="' + x(index).toFixed(1) + '" y="' + (height - 40) + '" text-anchor="middle">' + dateLabel(item.date) + '</text>' : '';
        }).join('');
        return '<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="每日攝取與TDEE趨勢圖">'
          + grid + '<path class="chart-line-tdee" d="' + path('tdee') + '" />'
          + '<path class="chart-line-intake" d="' + path('intake') + '" />'
          + dots('tdee', 'chart-dot-tdee') + dots('intake', 'chart-dot-intake') + labels + waterIcons
          + '</svg><div class="chart-legend"><span class="legend-item"><i class="legend-dot legend-intake"></i>已攝取</span><span class="legend-item"><i class="legend-dot legend-tdee"></i>可攝取總量 TDEE</span></div></div>';
      }
    }());
  </script>
</body>
</html>
