<!doctype html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --cream: #fffaf0;
      --yellow: #f5d77a;
      --yellow-dark: #e6bc42;
      --ink: #332f29;
      --muted: #776f64;
      --green: #4e8b69;
      --red: #c65f55;
      --white: #ffffff;
      --line: #eadfca;
      --shadow: 0 10px 30px rgba(85, 65, 28, .10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }
    body.bmr-modal-open { overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button { touch-action: manipulation; }
    .app { max-width: 760px; margin: 0 auto; padding: 18px 14px 120px; }
    .hero {
      padding: 20px;
      border-radius: 24px;
      background: linear-gradient(135deg, #ffe9a8, #f6d76e);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    /* 提醒設定位於 hero 內，避免裝飾圖覆蓋右側箭頭與點擊區。 */
    .hero::after { display: none; pointer-events: none; }
    .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .12em; color: #765c17; }
    h1 { margin: 7px 0 4px; font-size: 27px; line-height: 1.15; }
    .hero p { margin: 0; color: #6b571f; }
    .energy-cards {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      position: relative;
      z-index: 1;
    }
    .energy-card {
      min-width: 0;
      padding: 11px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,.76);
    }
    .energy-label {
      display: block;
      color: #765c17;
      font-size: 11px;
      font-weight: 900;
      line-height: 1.3;
    }
    .energy-value {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin-top: 4px;
      white-space: nowrap;
    }
    .energy-value strong { min-width: 0; font-size: 25px; line-height: 1; }
    .energy-value small { color: #6b571f; font-size: 11px; font-weight: 800; }
    .energy-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #e5f2e8;
      color: #35684b;
      font-size: 9px;
      font-style: normal;
      font-weight: 900;
    }
    .energy-help {
      display: block;
      margin-top: 5px;
      color: #6b571f;
      font-size: 9px;
      font-weight: 700;
      line-height: 1.35;
    }
    .record-date-picker {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid rgba(120, 86, 10, .18);
      border-radius: 14px;
      background: rgba(255,255,255,.78);
      position: relative;
      z-index: 2;
    }
    .record-date-picker > summary { list-style: none; cursor: pointer; }
    .record-date-picker > summary::-webkit-details-marker { display: none; }
    .record-date-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .record-date-summary strong { color: #4f3e15; font-size: 13px; }
    .record-status-tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }
    .record-status-tag.editing { background: #fff0bd; color: #765c17; }
    .record-status-tag.complete { background: #dff1e4; color: #2f6b47; }
    .record-date-toggle {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 7px 11px;
      border: 1px solid #d7b13b;
      border-radius: 11px;
      background: #fffaf0;
      color: #6b5110;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }
    .record-date-hint {
      margin: 6px 0 0;
      color: #775a0d;
      font-size: 11px;
      line-height: 1.4;
    }
    .record-date-options {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-top: 9px;
    }
    .record-date-options[hidden] { display: none !important; }
    .record-date-option {
      min-height: 42px;
      padding: 6px 4px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fff;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }
    .record-date-option.active { border-color: #d8a91e; background: var(--yellow); color: var(--ink); }
    .record-date-option small { display: block; margin-top: 2px; font-size: 9px; font-weight: 700; }
    .backfill-banner {
      margin-top: 9px;
      padding: 8px 10px;
      border-radius: 10px;
      background: #fff0c9;
      color: #775a0d;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.45;
    }
    .section {
      margin-top: 16px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--white);
      box-shadow: 0 6px 18px rgba(85, 65, 28, .05);
    }
    .section-title { margin: 0 0 12px; font-size: 17px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .exercise-list { display: grid; gap: 10px; }
    .exercise-record { padding: 11px; border: 1px solid var(--line); border-radius: 14px; background: #fffdf8; }
    .exercise-record-grid { display: grid; grid-template-columns: minmax(0, 1fr) 120px 102px auto; gap: 8px; align-items: end; }
    .exercise-custom-control { display: flex; gap: 6px; align-items: end; }
    .exercise-custom-control input { flex: 1; min-width: 0; }
    .exercise-custom-control button { margin-top: 5px; min-height: 44px; padding: 8px 10px; white-space: nowrap; }
    .exercise-record .danger-small { min-height: 40px; }
    .exercise-add-row { display: flex; gap: 8px; margin-top: 10px; }
    .exercise-add-row button { min-height: 40px; }
    .custom-food-grid { display: grid; grid-template-columns: minmax(0, 1fr) 112px; gap: 10px; }
    .custom-food-grid .secondary { grid-column: 1 / -1; width: 100%; }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
    input, select, textarea {
      width: 100%;
      margin-top: 5px;
      padding: 12px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fffdf8;
      outline: none;
    }
    select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 38px;
      background-image: linear-gradient(45deg, transparent 50%, #776f64 50%), linear-gradient(135deg, #776f64 50%, transparent 50%);
      background-position: calc(100% - 17px) 52%, calc(100% - 11px) 52%;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
    }
    select:disabled { opacity: .62; }
    input:focus, select:focus, textarea:focus { border-color: var(--yellow-dark); box-shadow: 0 0 0 3px rgba(230,188,66,.16); }
    textarea { min-height: 82px; resize: vertical; }
    .hint { margin: 8px 0 0; font-size: 12px; line-height: 1.5; color: var(--muted); }
    .bmr-helper {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 1px solid #e5ca70;
      border-radius: 15px;
      background: #fff9e6;
      overflow: hidden;
      position: relative;
    }
    .bmr-field-heading {
      display: block;
      margin-bottom: 4px;
    }
    .bmr-field-heading > label {
      margin: 0;
    }
    .bmr-input-wrap {
      position: relative;
    }
    .bmr-input-wrap > input {
      padding-right: 82px;
    }
    .bmr-input-wrap > .bmr-helper {
      position: absolute;
      top: 50%;
      right: 8px;
      z-index: 2;
      width: auto;
      transform: translateY(-50%);
    }
    .bmr-helper:not([open]) {
      border-color: transparent;
      background: transparent;
      overflow: visible;
    }
    .bmr-helper summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      min-height: 38px;
      padding: 7px 10px;
      color: #765c17;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      list-style: none;
      border-radius: 11px;
    }
    .bmr-helper summary::-webkit-details-marker { display: none; }
    .bmr-helper summary::marker {
      display: none;
      content: '';
    }
    .bmr-helper:not([open]) summary {
      width: fit-content;
      min-height: 32px;
      margin: 0;
      padding: 6px 11px;
      border: 1px solid #e5ca70;
      background: #fff9e6;
      font-size: 11px;
      white-space: nowrap;
    }
    .bmr-helper[open] {
      position: fixed;
      top: 50%;
      left: 50%;
      right: auto;
      z-index: 1000;
      width: min(560px, calc(100vw - 28px));
      max-height: calc(100vh - 32px);
      margin: 0;
      transform: translate(-50%, -50%);
      box-shadow: 0 20px 50px rgba(48, 37, 16, .24), 0 0 0 100vmax rgba(38, 31, 19, .38);
      overflow: auto;
      overscroll-behavior: contain;
    }
    .bmr-helper[open] summary {
      min-height: 48px;
      padding-right: 52px;
      border-bottom: 1px solid #eadb9e;
      border-radius: 0;
      background: #fff5d5;
    }
    .bmr-helper[open] .bmr-helper-body { padding-bottom: 16px; }
    .bmr-helper[open] .bmr-helper-action { display: none; }
    .bmr-helper[open] .bmr-helper-close { top: 10px; right: 11px; }
    .bmr-helper-title { min-width: 0; }
    .bmr-helper-action { color: #9b8653; font-size: 10px; font-weight: 800; white-space: nowrap; }
    .bmr-helper:not([open]) .bmr-helper-action { display: none; }
    .bmr-helper-body { padding: 0 13px 13px; }
    .bmr-helper-close {
      position: absolute;
      top: 7px;
      right: 10px;
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid #d9c891;
      border-radius: 999px;
      background: #fffdf8;
      color: #765c17;
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
    }
    .bmr-helper-close:hover { background: #fff0bd; }
    .bmr-helper-close:focus-visible { outline: 3px solid rgba(230,188,66,.28); outline-offset: 1px; }
    .bmr-helper-body .form-grid { margin-top: 11px; }
    .bmr-field-group { min-width: 0; }
    .bmr-inline-hint { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; font-weight: 700; line-height: 1.35; }
    .bmr-calc-button {
      width: 100%;
      min-height: 46px;
      margin-top: 12px;
      border: 0;
      border-radius: 13px;
      background: var(--yellow);
      color: var(--ink);
      font-weight: 900;
      cursor: pointer;
    }
    .privacy-note {
      margin: 10px 0 0;
      padding: 9px 10px;
      border-radius: 11px;
      background: #eaf5ed;
      color: #35684b;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.55;
    }
    .bmr-result {
      margin-top: 10px;
      color: #35684b;
      font-size: 13px;
      font-weight: 900;
      text-align: center;
    }
    .personal-form-grid { align-items: start; }
    .exercise-record-grid select { appearance: none; -webkit-appearance: none; }
    .public-settings {
      margin-top: 14px;
      border: 1px solid #b7d3c2;
      border-radius: 16px;
      background: #f4faf6;
      overflow: hidden;
    }
    .public-settings-summary {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) 22px;
      align-items: center;
      gap: 10px;
      min-height: 72px;
      padding: 12px 14px;
      color: var(--ink);
      cursor: pointer;
      list-style: none;
      -webkit-tap-highlight-color: transparent;
    }
    .public-settings-summary::-webkit-details-marker { display: none; }
    .public-settings-summary::marker { display: none; content: ''; }
    .public-settings-icon {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: #dff1e5;
      font-size: 20px;
    }
    .public-settings-heading {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 15px;
      color: #35684b;
    }
    .public-settings-badge {
      padding: 2px 7px;
      border-radius: 999px;
      background: #ffe28a;
      color: #72560b;
      font-size: 10px;
      font-style: normal;
      font-weight: 900;
    }
    .public-settings-status {
      display: block;
      margin-top: 4px;
      color: #6f756f;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
    }
    .public-settings-chevron {
      color: #568267;
      font-size: 20px;
      font-weight: 900;
      transition: transform .18s ease;
    }
    .public-settings[open] .public-settings-chevron { transform: rotate(180deg); }
    .public-settings[open] .public-settings-summary {
      border-bottom: 1px solid #d6e7dc;
      background: #edf7f0;
    }
    .public-settings-body { padding: 12px 14px 14px; }
    .public-settings .hint { margin: 0 0 10px; }
    .privacy-toggle {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 10px;
      padding: 11px 12px;
      border: 1px solid #d6e7dc;
      border-radius: 13px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
    }
    .privacy-toggle input { width: 20px; height: 20px; margin: 0; flex: 0 0 auto; accent-color: var(--green); }
    .privacy-toggle span { font-size: 13px; line-height: 1.45; }
    .privacy-toggle input:disabled + span { opacity: .48; }
    .reminder-settings {
      margin-top: 12px;
      border: 1px solid #c4ddeb;
      border-radius: 16px;
      background: #f7fcff;
      overflow: hidden;
    }
    .reminder-settings > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      box-sizing: border-box;
      min-height: 54px;
      padding: 10px 14px;
      color: #21677f;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      list-style: none;
    }
    .reminder-settings > summary::-webkit-details-marker { display: none; }
    .reminder-settings > summary::marker { display: none; content: ''; }
    .reminder-settings > summary::after { content: '⌄'; font-size: 20px; color: #568da5; pointer-events: none; }
    .reminder-settings[open] > summary { border-bottom: 1px solid #d8eaf2; background: #edf8fc; }
    .reminder-settings[open] > summary::after { transform: rotate(180deg); }
    .reminder-settings-body { padding: 10px 14px 14px; }
    .reminder-settings-body p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .reminder-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; margin-top: 10px; }
    .reminder-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      padding: 9px 7px;
      border: 1px solid #cfe1e8;
      border-radius: 12px;
      background: #fff;
      color: #315b6b;
      cursor: pointer;
    }
    .reminder-toggle input { width: 18px; height: 18px; margin: 0; flex: 0 0 auto; accent-color: #4e8b69; }
    .reminder-toggle span { min-width: 0; font-size: 11px; font-weight: 900; line-height: 1.25; }
    .reminder-toggle small { display: block; margin-top: 2px; color: #7b8f99; font-size: 9px; font-weight: 700; }
    .reminder-save-status { min-height: 16px; margin-top: 8px; color: #4e8b69; font-size: 10px; font-weight: 800; }
    @media (max-width: 560px) {
      .reminder-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .public-wall-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
      padding: 9px 12px;
      border: 1px solid #9fc7ae;
      border-radius: 11px;
      background: #fff;
      color: #35684b;
      font-size: 12px;
      font-weight: 900;
      text-decoration: none;
    }
    .history-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0 0 6px;
      padding: 9px 12px;
      border: 1px solid #e5ca70;
      border-radius: 11px;
      background: #fffaf0;
      color: #765c17;
      font-size: 12px;
      font-weight: 900;
      text-decoration: none;
    }
    .quick-access {
      margin-top: 14px;
      padding: 12px 14px 14px;
      border: 1px solid #e7dcc4;
      border-radius: 16px;
      background: #fffdf7;
    }
    .quick-access-heading {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 9px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 900;
    }
    .quick-access-heading small {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .quick-access-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .quick-access-link {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      min-height: 58px;
      padding: 9px 10px;
      border: 1px solid #c9dfcf;
      border-radius: 13px;
      background: #f5fbf7;
      color: #35684b;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .quick-access-link.history {
      border-color: #ead38a;
      background: #fffaf0;
      color: #765c17;
    }
    .quick-access-icon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 31px;
      height: 31px;
      border-radius: 10px;
      background: #dff1e5;
      font-size: 17px;
    }
    .quick-access-link.history .quick-access-icon { background: #ffeab0; }
    .quick-access-copy { min-width: 0; }
    .quick-access-copy strong {
      display: block;
      font-size: 13px;
      line-height: 1.3;
    }
    .quick-access-copy small {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .category-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .category-chips::-webkit-scrollbar { display: none; }
    .meal-tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #f7f1e5;
    }
    .pill {
      flex: 0 0 auto;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-weight: 800;
      cursor: pointer;
    }
    .pill.active { border-color: var(--yellow-dark); background: var(--yellow); color: var(--ink); }
    .pill.done { border-color: #8db89d; color: #35684b; }
    .pill.active.done { border-color: var(--green); background: #dceedd; color: #28543c; }
    .meal-tabs .pill {
      width: 100%;
      min-width: 0;
      padding: 10px 3px;
      border-color: transparent;
      border-radius: 12px;
      background: transparent;
      font-size: 13px;
      white-space: nowrap;
    }
    .meal-tabs .pill.active {
      border-color: #e4bd45;
      background: var(--yellow);
      box-shadow: 0 3px 8px rgba(150, 113, 20, .14);
    }
    .meal-tabs .pill.done:not(.active) { border-color: transparent; background: #e6f2e9; }
    .meal-tabs-caption {
      margin: 12px 0 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }
    .entry-mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 12px;
      padding: 4px;
      border-radius: 14px;
      background: #f4efe5;
    }
    .entry-mode-button {
      min-height: 42px;
      padding: 8px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }
    .entry-mode-button.active {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(70, 54, 24, .1);
    }
    .manual-entry-box {
      margin-top: 12px;
      padding: 14px;
      border: 1px solid #b7d3c2;
      border-radius: 18px;
      background: #f4faf6;
    }
    .search { margin: 10px 0; }
    .food-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .frequent-food-box {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #eadfca;
      border-radius: 16px;
      background: #fffdf7;
    }
    .frequent-food-box > summary,
    details.food-library > summary { list-style: none; cursor: pointer; }
    .frequent-food-box > summary::-webkit-details-marker,
    details.food-library > summary::-webkit-details-marker { display: none; }
    .frequent-food-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 26px;

  <script>
    window.__dietAppBuild = '2026.08.21-70-test';
    window.__dietAppReady = false;
    window.__dietAppFailed = false;
    window.__dietAppStage = '啟動程式';
    window.__dietAppTimer = null;
    window.__dietShowTimeout = function () {
      if (window.__dietAppReady) return;
      var root = document.getElementById('app');
      if (!root) return;
      root.innerHTML = '';
      var box = document.createElement('div');
      box.className = 'notice';
      var title = document.createElement('h2');
      title.textContent = '畫面載入逾時';
      var detail = document.createElement('p');
      detail.textContent = '版本：' + String(window.__dietAppBuild || '未知') + '・停在：' + String(window.__dietAppStage || '未知階段');
      var hint = document.createElement('p');
      hint.className = 'hint';
      hint.textContent = '請關閉此頁，回 LINE 重新輸入「打卡」。若仍出現，請截圖這段訊息。';
      box.appendChild(title);
      box.appendChild(detail);
      box.appendChild(hint);
      root.appendChild(box);
    };

    window.onerror = function (message, source, line, column) {
      window.__dietAppFailed = true;
      window.clearTimeout(window.__dietAppTimer);
      var root = document.getElementById('app');
      if (!root) return;
      root.innerHTML = '';
      var box = document.createElement('div');
      box.className = 'notice';
      var title = document.createElement('h2');
      title.textContent = '畫面載入失敗';
      var detail = document.createElement('p');
      detail.textContent = '版本：' + String(window.__dietAppBuild || '未知') + '・' + String(message || '未知錯誤') + '（第 ' + String(line || '?') + ' 行）';
      var hint = document.createElement('p');
      hint.className = 'hint';
      hint.textContent = '請截圖這段訊息，我就能直接定位問題。';
      box.appendChild(title);
      box.appendChild(detail);
      box.appendChild(hint);
      root.appendChild(box);
    };
  </script>

  <script>window.__dietAppStage = '主程式已下載';</script>
  <script>
    let BOOTSTRAP = null;

      BOOTSTRAP = decodeBootstrapFromDom_();
    } catch (error) {
      bootstrapError = error;
    }
    const MEMBER = BOOTSTRAP && BOOTSTRAP.member ? BOOTSTRAP.member : {};
    const FOODS = BOOTSTRAP && Array.isArray(BOOTSTRAP.foods) ? BOOTSTRAP.foods : [];
    const FREQUENT_FOODS = BOOTSTRAP && Array.isArray(BOOTSTRAP.frequentFoods)
      ? BOOTSTRAP.frequentFoods
      : [];
    const WATER_SETTINGS = BOOTSTRAP && BOOTSTRAP.waterSettings
      ? BOOTSTRAP.waterSettings
      : { enabled: false, goalMl: 2000 };
    // 四個提醒時段各自獨立；舊好友欄位留白時由後端視為開啟。
    const REMINDER_SETTINGS = {
      morning: MEMBER.personalReminder !== false && MEMBER.reminderMorning !== false,
      noon: MEMBER.personalReminder !== false && MEMBER.reminderNoon !== false,
      evening: MEMBER.personalReminder !== false && MEMBER.reminderEvening !== false,
      late: MEMBER.personalReminder !== false && MEMBER.reminderLate !== false,
    };
    const FOOD_BY_ID = {};
    const foodCardNodes = {};

    function hydrateStateFromDailyLog(savedLog) {
      activeSavedLog = savedLog && savedLog.exists ? savedLog : null;
      Object.keys(mealLabels).forEach(mealKey => {
        state.meals[mealKey] = {};
        state.aiMeals[mealKey] = [];
      });
      state.exerciseRecords = [];
      state.waterEnabled = Boolean(WATER_SETTINGS.enabled);
      state.waterGoalMl = Math.max(500, Number(WATER_SETTINGS.goalMl || 2000));
      state.waterMl = 0;
      state.pendingAiItems = [];
      state.pendingAiMeal = '';
      state.analyzing = false;
      todayIsComplete = Boolean(activeSavedLog && activeSavedLog.isComplete);
      if (!activeSavedLog) {
        state.exerciseRecords = [newExerciseRecord()];
        return;
      }
      state.waterMl = Math.max(0, Number(activeSavedLog.waterMl || 0));
      Object.keys(mealLabels).forEach(mealKey => {
        const savedMeals = activeSavedLog.meals && Array.isArray(activeSavedLog.meals[mealKey])
          ? activeSavedLog.meals[mealKey]
          : [];
        savedMeals.forEach(item => {
          const id = String(item.id || '');
          const quantity = Math.max(0, Number(item.quantity || 0));
          if (id && quantity) state.meals[mealKey][id] = quantity;
        });
        state.aiMeals[mealKey] = activeSavedLog.aiMeals && Array.isArray(activeSavedLog.aiMeals[mealKey])
          ? activeSavedLog.aiMeals[mealKey].map(item => Object.assign({}, item))
          : [];
      });
      const legacyExtraKcal = Math.max(0, Number(activeSavedLog.extraKcal || 0));
      if (legacyExtraKcal) {
        state.aiMeals.lateNight.push({
          id: 'legacy_extra_kcal',
          source: 'manual',
          name: '舊版直接輸入',
          portion: '舊版未指定餐別，升級後歸入宵夜',
          grams: 0,
          calories: Math.round(legacyExtraKcal),
          low: Math.round(legacyExtraKcal),
          high: Math.round(legacyExtraKcal),
          confidence: '',
          notes: '',
        });
      }
      const savedExercises = Array.isArray(activeSavedLog.exerciseRecords)
        ? activeSavedLog.exerciseRecords
        : [];
      state.exerciseRecords = savedExercises.map(normalizeExerciseRecord);
      // 舊版只有單一運動欄位，第一次載入時自動轉成一筆清單。
      if (!state.exerciseRecords.length && (Number(activeSavedLog.exerciseMinutes || 0) || Number(activeSavedLog.exerciseKcal || 0) || activeSavedLog.exerciseName)) {
        state.exerciseRecords = [normalizeExerciseRecord({
          name: activeSavedLog.exerciseName || '',
          minutes: activeSavedLog.exerciseMinutes || 0,
          kcal: activeSavedLog.exerciseKcal || 0,
        })];
      }
      if (!state.exerciseRecords.length) state.exerciseRecords = [newExerciseRecord()];
    }

    function newExerciseRecord() {
      return { type: 'none', name: '', minutes: '', kcal: '' };
    }

    function normalizeExerciseRecord(record) {
      record = record || {};
      const hasLegacyValue = Boolean(record.name || Number(record.minutes || 0) || Number(record.kcal || record.calories || 0));
      return {
        type: Object.prototype.hasOwnProperty.call(commonExercises, record.type)
          ? record.type
          : (hasLegacyValue ? 'custom' : 'none'),
        name: String(record.name || '').slice(0, 60),
        minutes: Math.max(0, Math.min(1440, Number(record.minutes || 0))) || '',
        kcal: Math.max(0, Math.min(10000, Number(record.kcal || record.calories || 0))) || '',
      };
    }

    function estimateExerciseKcal(record) {
      const definition = commonExercises[record.type];
      const minutes = Number(record.minutes || 0);
      if (!definition || !definition.met || minutes <= 0) return 0;
      // MET 估算：MET × 3.5 × 體重kg ÷ 200 × 分鐘。
      const weight = Number(state.exerciseWeightKg || 60);
      return Math.round(definition.met * 3.5 * weight / 200 * minutes);
    }

    function exerciseSummary() {
      const records = state.exerciseRecords.map(normalizeExerciseRecord).filter(record => (
        record.type !== 'none' && (record.name || Number(record.minutes) > 0 || Number(record.kcal) > 0)
      ));
      return {
        records,
        name: records.map(record => record.name).filter(Boolean).join('、'),
        minutes: records.reduce((sum, record) => sum + Number(record.minutes || 0), 0),
        kcal: records.reduce((sum, record) => sum + Number(record.kcal || 0), 0),
      };
    }

    function renderExerciseRecords() {
      const root = document.getElementById('exerciseRecords');
      if (!root) return;
      root.innerHTML = '';
      if (!state.exerciseRecords.length) {
        root.append(el('div', 'selected-empty', '今天還沒有運動紀錄，可以按「＋新增運動」。'));
        return;
      }
      state.exerciseRecords.forEach((record, index) => {
        const normalized = normalizeExerciseRecord(record);
        state.exerciseRecords[index] = normalized;
        // 後續事件必須修改 state 內的同一個物件；否則重繪或自動儲存時
        // 會讀回 normalized 舊值，讓選好的運動又跳回「請選擇」。
        record = normalized;
        const card = el('div', 'exercise-record');
        const grid = el('div', 'exercise-record-grid');
        const itemLabel = el('label', '', '運動項目');
        if (normalized.type === 'custom') {
          const customControl = el('div', 'exercise-custom-control');
          const customInput = document.createElement('input');
          customInput.type = 'text';
          customInput.setAttribute('aria-label', '自訂運動名稱');
          customInput.value = normalized.name;
          customInput.placeholder = '輸入自訂運動名稱';
          customInput.maxLength = 60;
          customInput.addEventListener('input', event => {
            record.name = event.target.value.slice(0, 60);
            updateTotals();
            markRecordChanged();
          });
          const chooseButton = el('button', 'secondary', '選常見');
          chooseButton.type = 'button';
          chooseButton.addEventListener('click', () => {
            record.type = 'none';
            record.name = '';
            record.kcal = '';
            renderExerciseRecords();
            updateTotals();
            markRecordChanged();
          });
          customControl.append(customInput, chooseButton);
          itemLabel.append(customControl);
        } else {
          const typeSelect = document.createElement('select');
          typeSelect.setAttribute('aria-label', '運動項目');
          const exerciseChoiceOrder = ['none', 'strength', 'swim', 'badminton', 'run', 'bicycle', 'incline', 'custom'];
          exerciseChoiceOrder.forEach(key => {
            const definition = commonExercises[key];
            const option = document.createElement('option');
            option.value = key;
            option.textContent = definition.label;
            typeSelect.appendChild(option);
          });
          typeSelect.value = normalized.type;
          let appliedType = normalized.type;
          const applyTypeSelection = event => {
            const nextType = String(event.target.value || 'none');
            if (nextType === appliedType) return;
            appliedType = nextType;
            record.type = nextType;
            const definition = commonExercises[nextType];
            if (nextType === 'custom') {
              record.name = '';
              record.kcal = '';
              updateTotals();
              markRecordChanged();
              window.setTimeout(() => {
                renderExerciseRecords();
                const customField = document.querySelector('#exerciseRecords .exercise-custom-control input');
                if (customField) customField.focus();
              }, 0);
              return;
            } else if (nextType === 'none') {
              record.name = '';
              record.kcal = '';
            } else {
              record.name = definition.label;
              record.kcal = estimateExerciseKcal(record) || '';
            }
            updateTotals();
            markRecordChanged();
          };
          typeSelect.onchange = applyTypeSelection;
          itemLabel.append(typeSelect);
        }
        const minutesLabel = el('label', '', '時間（分）');
        const minutesInput = document.createElement('input');
        minutesInput.type = 'number';
        minutesInput.inputMode = 'numeric';
        minutesInput.min = '0';
        minutesInput.max = '1440';
        minutesInput.value = normalized.minutes;
        minutesInput.placeholder = '分鐘';
        minutesInput.addEventListener('input', event => {
          record.minutes = Math.max(0, Math.min(1440, Number(event.target.value || 0)));
          if (record.type !== 'custom' && record.type !== 'none') {
            record.kcal = estimateExerciseKcal(record) || '';
            kcalInput.value = record.kcal;
            updateTotals();
          }
          markRecordChanged();
        });
        minutesLabel.append(minutesInput);
        const kcalLabel = el('label', '', '活動熱量');
        const kcalInput = document.createElement('input');
        kcalInput.type = 'number';
        kcalInput.inputMode = 'numeric';
        kcalInput.min = '0';
        kcalInput.max = '10000';
        kcalInput.value = normalized.kcal;
        kcalInput.placeholder = 'kcal';
        kcalInput.addEventListener('input', event => {
          record.kcal = Math.max(0, Math.min(10000, Number(event.target.value || 0)));
          updateTotals();
          markRecordChanged();
        });
        kcalLabel.append(kcalInput);
        const remove = el('button', 'danger-small', '刪除');
        remove.type = 'button';
        remove.addEventListener('click', () => {
          state.exerciseRecords.splice(index, 1);
          renderExerciseRecords();
          updateTotals();
          markRecordChanged(900);
        });
        grid.append(itemLabel, minutesLabel, kcalLabel, remove);
        card.append(grid);
        root.append(card);
      });
    }

    function renderWaterProgress() {
      const panel = document.getElementById('waterTrackingPanel');
      const toggle = document.getElementById('waterTrackingEnabled');
      if (panel) panel.hidden = !state.waterEnabled;
      if (toggle) toggle.checked = state.waterEnabled;
      const root = document.getElementById('waterProgress');
      if (!root) return;
      const total = document.getElementById('waterCurrentTotal');
      const percentEl = document.getElementById('waterCupPercent');
      const fill = document.getElementById('waterCupFill');
      const surface = document.getElementById('waterCupSurface');
      if (!state.waterEnabled) {
        root.innerHTML = '';
        if (total) total.textContent = '0 ml';
        if (percentEl) percentEl.textContent = '0%';
        if (fill) {
          fill.setAttribute('y', '113');
          fill.setAttribute('height', '0');
        }
        if (surface) {
          surface.setAttribute('cy', '113');
          surface.style.opacity = '0';
        }
        return;
      }
      const current = Math.max(0, Math.round(Number(state.waterMl || 0)));
      const goal = Math.max(500, Math.round(Number(state.waterGoalMl || 2000)));
      const percent = Math.min(100, Math.round(current / goal * 100));
      const remaining = Math.max(0, goal - current);
      if (total) total.textContent = current + ' ml';
      if (percentEl) percentEl.textContent = percent + '%';
      if (fill) {
        const cupHeight = 95;
        const fillHeight = Math.round(cupHeight * percent / 100);
        fill.setAttribute('y', String(113 - fillHeight));
        fill.setAttribute('height', String(fillHeight));
        if (surface) {
          surface.setAttribute('cy', String(113 - fillHeight));
          surface.style.opacity = fillHeight > 0 ? '0.95' : '0';
        }
      }
      root.innerHTML = [
        '<div class="water-progress-top"><strong>' + percent + '%</strong><span>' + (remaining ? '還差 ' + remaining + ' ml' : '今日已達標') + '</span></div>',
        '<div class="water-progress-track"><span style="width:' + percent + '%"></span></div>',
        '<small>目標 ' + goal + ' ml</small>',
      ].join('');
    }

    function adjustWater(direction) {
      const amountInput = document.getElementById('waterAmount');
      const amount = Math.max(1, Math.min(10000, Math.round(Number(amountInput && amountInput.value || 0))));
      if (!amount) return;
      state.waterMl = Math.max(0, Math.min(10000, Math.round(Number(state.waterMl || 0) + direction * amount)));
      renderWaterProgress();
      markRecordChanged(250);
    }

    function bindKeyboardAvoidance() {
      if (keyboardAvoidanceBound) return;
      keyboardAvoidanceBound = true;

      const updateKeyboardOffset = () => {
        const viewport = window.visualViewport;
        const offset = viewport
          ? Math.max(0, Math.round(window.innerHeight - viewport.height - viewport.offsetTop))
          : 0;
        document.documentElement.style.setProperty('--keyboard-offset', offset + 'px');
      };

      const isEditable = element => element && (
        (element.matches('input, select, textarea')
          && element.type !== 'hidden'
          && element.type !== 'file')
      );

      const scrollFocusedFieldIntoView = () => {
        const field = document.activeElement;
        if (!isEditable(field)) return;

        window.setTimeout(() => {
          if (!isEditable(document.activeElement)) return;
          document.activeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });

          // visualViewport 能反映手機鍵盤出現後真正可視的高度。
          window.setTimeout(() => {
            const active = document.activeElement;
            const viewport = window.visualViewport;
            if (!isEditable(active) || !viewport) return;
            const rect = active.getBoundingClientRect();
            const safeBottom = viewport.height - 12;
            if (rect.bottom > safeBottom) {
              window.scrollBy({ top: rect.bottom - safeBottom, behavior: 'smooth' });
            }
          }, 120);
        }, 260);
      };

      document.addEventListener('focusin', event => {
        if (!isEditable(event.target)) return;
        document.body.classList.add('keyboard-open');
        updateKeyboardOffset();
        scrollFocusedFieldIntoView();
      });

      document.addEventListener('focusout', () => {
        window.setTimeout(() => {
          if (!isEditable(document.activeElement)) {
            document.body.classList.remove('keyboard-open');
            document.documentElement.style.setProperty('--keyboard-offset', '0px');
          }
        }, 180);
      });

      if (window.visualViewport) {
        updateKeyboardOffset();
        window.visualViewport.addEventListener('resize', () => {
          updateKeyboardOffset();
          if (isEditable(document.activeElement)) scrollFocusedFieldIntoView();
        });
        window.visualViewport.addEventListener('scroll', updateKeyboardOffset);
      }
    }

    let reminderSaveTimer = null;
    function savePersonalReminderSettings() {
      const ids = {
        morning: 'reminderMorning',
        noon: 'reminderNoon',
        evening: 'reminderEvening',
        late: 'reminderLate',
      };
      const settings = Object.fromEntries(Object.entries(ids).map(([key, id]) => [
        key,
        Boolean(document.getElementById(id) && document.getElementById(id).checked),
      ]));
      const status = document.getElementById('reminderSaveStatus');
      if (status) status.textContent = '儲存中…';
      window.clearTimeout(reminderSaveTimer);
      reminderSaveTimer = window.setTimeout(() => {
        google.script.run
          .withSuccessHandler(result => {
            Object.assign(REMINDER_SETTINGS, result && result.settings ? result.settings : settings);
            if (status) status.textContent = '已儲存提醒設定';
          })
          .withFailureHandler(error => {
            if (status) status.textContent = '儲存失敗，請稍後再試';
            showToast(error && error.message ? error.message : '提醒設定儲存失敗');
          })
          .savePersonalReminderSettings({
            uid: BOOTSTRAP.uid,
            sig: BOOTSTRAP.sig,
            settings,
          });
      }, 180);
    }

    function calculateBmrEstimate() {
      const sex = document.getElementById('bmrCalcSex').value;
      const age = Number(document.getElementById('bmrCalcAge').value || 0);
      const height = Number(document.getElementById('bmrCalcHeight').value || 0);
      const weight = Number(document.getElementById('bmrCalcWeight').value || 0);
      if (!sex || age < 18 || age > 100 || height < 100 || height > 250 || weight < 20 || weight > 500) {
        showToast('請完整填寫生理性別、年齡、身高與體重。');
        return;
      }
      const estimate = Math.round(10 * weight + 6.25 * height - 5 * age + (sex === 'male' ? 5 : -161));
      state.exerciseWeightKg = weight;
      saveLocalWeightKg_(weight);
      document.getElementById('bmr').value = estimate;
      updateTotals();
      const result = document.getElementById('bmrResult');
      result.textContent = `估算 BMR：約 ${estimate} kcal／天`;
      result.hidden = false;
      markRecordChanged();
      showToast(`已填入估算 BMR：${estimate} kcal／天`);
    }

    function localWeightStorageKey_() {
      return `diet-local-weight:v1:${BOOTSTRAP && BOOTSTRAP.uid ? BOOTSTRAP.uid : 'anonymous'}`;
    }

    function loadLocalWeightKg_() {
      try {
        const value = Number(window.localStorage.getItem(localWeightStorageKey_()) || 0);

    // AI 估算會保留「原始估算份量／熱量」作為基準，使用者改 g 或 ml 時按比例重算。
    function normalizeAiPortion(item) {
      const unit = String(item.unit || '').toLowerCase() === 'ml' ? 'ml' : 'g';
      const hasBaseAmount = item.baseAmount !== undefined && item.baseAmount !== null && Number(item.baseAmount) > 0;
      const baseAmount = Math.max(0, Number(hasBaseAmount ? item.baseAmount : (item.amount || item.grams || 0)));
      const hasAmount = item.amount !== undefined && item.amount !== null;
      const amount = Math.max(0, Number(hasAmount ? item.amount : (item.grams || baseAmount || 0)));
      const baseCalories = Math.max(0, Number(item.baseCalories || item.originalCalories || item.calories || 0));
      const baseLow = Math.max(0, Number(item.baseLow || item.low || baseCalories));
      const baseHigh = Math.max(0, Number(item.baseHigh || item.high || baseCalories));
      item.unit = unit;
      item.baseAmount = baseAmount;
      item.amount = amount;
      item.baseCalories = baseCalories;
      item.baseLow = baseLow;
      item.baseHigh = baseHigh;
      if (unit === 'g') item.grams = amount;
      return item;
    }

    function recalcAiItemCalories(item) {
      normalizeAiPortion(item);
      if (item.baseAmount > 0 && item.baseCalories > 0) {
        item.calories = Math.round(item.baseCalories * item.amount / item.baseAmount);
        item.low = Math.round(item.baseLow * item.amount / item.baseAmount);
        item.high = Math.round(item.baseHigh * item.amount / item.baseAmount);
      }
      const shownAmount = item.amount > 0 ? `${item.amount} ${item.unit}` : '';
      if (shownAmount) item.portion = shownAmount;
    }

    function appendPortionEditor(row, item, onChange) {
      normalizeAiPortion(item);
      const editor = el('div', 'portion-editor');
      editor.append(el('span', '', '調整份量'));
      const amount = document.createElement('input');
      amount.type = 'number';
      amount.min = '0';
      amount.max = '5000';
      amount.step = '1';
      amount.inputMode = 'decimal';
      amount.value = item.amount > 0 ? item.amount : '';
      amount.setAttribute('aria-label', `${item.name}份量`);
      const unit = document.createElement('select');
      ['g', 'ml'].forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        unit.append(option);
      });
      unit.value = item.unit;
      const changed = () => {
        const next = Number(amount.value || 0);
        item.unit = unit.value;
        item.amount = Number.isFinite(next) ? Math.max(0, next) : 0;
        recalcAiItemCalories(item);
        onChange(item, amount, unit);
      };
      amount.addEventListener('input', changed);
      unit.addEventListener('change', changed);
      editor.append(amount, unit);
      row.append(editor);
      return { amount, unit };
    }

    function handleFoodPhoto(event) {
      const file = event.target.files && event.target.files[0];
      event.target.value = '';
      if (!file || state.analyzing) return;
      if (String(file.type || '').toLowerCase().indexOf('image/') !== 0) {
        showToast('請選擇照片檔案。');
        return;
      }

      // 拍照前不預設餐別；分析完成後再由使用者選擇早餐、午餐、晚餐等餐別。
      state.pendingAiItems = [];
      state.pendingAiMeal = '';
      renderAiReview();
      state.photoPanelVisible = true;
      const photoPanel = document.getElementById('photoEntryPanel');
      if (photoPanel) photoPanel.hidden = false;
      setAnalyzing(true, `正在壓縮照片…`);
      compressPhoto(file).then(imageDataUrl => {
        const preview = document.getElementById('photoPreview');
        preview.src = imageDataUrl;
        preview.hidden = false;
        setAnalyzing(true, 'Gemini 正在分析餐點，約需幾秒…');

        google.script.run
          .withSuccessHandler(result => {
            state.analyzing = false;
            const recognizedItems = (result.items || []).map((item, index) => ({
              id: `ai_${Date.now()}_${index}`,
              source: 'gemini',
              name: item.name || '',
              portion: item.portion || '',
              amount: Number(item.estimatedAmount || item.estimatedGrams || 0),
              baseAmount: Number(item.estimatedAmount || item.estimatedGrams || 0),
              unit: item.unit === 'ml' ? 'ml' : 'g',
              baseCalories: Number(item.estimatedCalories || 0),
              baseLow: Number(item.caloriesLow || item.estimatedCalories || 0),
              baseHigh: Number(item.caloriesHigh || item.estimatedCalories || 0),
              grams: Number(item.estimatedGrams || item.estimatedAmount || 0),
              calories: Number(item.estimatedCalories || 0),
              low: Number(item.caloriesLow || 0),
              high: Number(item.caloriesHigh || 0),
              confidence: item.confidence || '低',
              notes: item.notes || '',
            }));
            if (recognizedItems.length) {
              // 先停在待確認區，讓使用者選餐別後才寫入該餐，避免早餐誤記。
              state.pendingAiItems = recognizedItems;
              state.pendingAiMeal = '';
              renderAiReview();
              setAnalyzing(false, '✅ 分析完成，請選擇要加入哪一餐。');
              const review = document.getElementById('aiResult');
              if (review) review.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
              setAnalyzing(false, `沒有辨識到食物，請換一張清楚的照片。`);
            }
          })
          .withFailureHandler(error => {
            setAnalyzing(false, '');
            showToast(`AI 分析失敗：${error && error.message ? error.message : error}`);
          })
          .analyzeFoodPhoto({ uid: BOOTSTRAP.uid, sig: BOOTSTRAP.sig, imageDataUrl });
      }).catch(error => {
        setAnalyzing(false, '');
        showToast(`照片處理失敗：${error.message || error}`);
      });
    }

    function compressPhoto(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('無法讀取照片'));
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => reject(new Error('照片格式無法讀取'));
          image.onload = () => {
            const maxSide = 1280;
            const ratio = Math.min(1, maxSide / Math.max(image.width, image.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(image.width * ratio));
            canvas.height = Math.max(1, Math.round(image.height * ratio));
            const context = canvas.getContext('2d');
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', .76));
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

        kcalInput.max = '5000';
        kcalInput.value = item.calories;
        kcalInput.addEventListener('input', e => {
          item.calories = Math.max(0, Number(e.target.value || 0));
          if (item.baseAmount > 0) item.baseCalories = item.calories;
          updatePendingAiSummary();
        });
        kcalLabel.append(kcalInput);

        appendPortionEditor(row, item, () => {
          kcalInput.value = item.calories;

        const portionLabel = el('label', '', '份量說明');

        portionInput.value = item.portion;
        portionInput.maxLength = 80;
        portionInput.addEventListener('input', e => { item.portion = e.target.value; });
        portionLabel.append(portionInput);
        const meta = el('div', 'ai-meta',
          `估計 ${item.amount || '?'} ${item.unit || 'g'} · 範圍 ${item.low}～${item.high} kcal · 信心 ${item.confidence}${item.notes ? `\n${item.notes}` : ''}`
        );
        const remove = el('button', 'danger-small', '移除這項');
        remove.type = 'button';
        remove.addEventListener('click', () => {
          state.pendingAiItems.splice(index, 1);
          renderAiReview(result);
        });
        row.append(grid, portionLabel, meta, remove);
        details.append(row);
      });
      root.append(details);

      const actions = el('div', 'ai-actions');

    function updatePendingAiSummary() {
      const total = Math.round(state.pendingAiItems.reduce(
        (sum, item) => sum + Math.max(0, Number(item.calories || 0)),
        0
      ));
      const low = Math.round(state.pendingAiItems.reduce(
        (sum, item) => sum + Math.max(0, Number(item.low || 0)),
        0
      ));
      const high = Math.round(state.pendingAiItems.reduce(
        (sum, item) => sum + Math.max(0, Number(item.high || 0)),
        0
      ));
      const totalRoot = document.getElementById('aiEstimatedTotal');
      if (totalRoot) totalRoot.textContent = `${total} kcal`;
      const rangeRoot = document.getElementById('aiEstimatedRange');
      if (rangeRoot) rangeRoot.textContent = `合理範圍約 ${low}～${high} kcal，細項可展開調整`;
      const confirm = document.getElementById('confirmAiButton');
      if (confirm) {
        confirm.disabled = !state.pendingAiMeal;
        confirm.textContent = state.pendingAiMeal
          ? `確認加入${mealLabels[state.pendingAiMeal]}（${total} kcal）`
          : `請先選擇餐別（${total} kcal）`;
      }
    }

        return;
      }
      const validItems = state.pendingAiItems
        .filter(item => item.name.trim() && Number(item.calories) > 0)
        .map(item => Object.assign({}, item, { calories: Math.round(Number(item.calories)) }));
      if (!validItems.length) {
        showToast('請至少保留一項有熱量的食物。');
        return;

      state.aiMeals[mealKey].push(...validItems);
      state.pendingAiItems = [];

      document.getElementById('aiResult').hidden = true;
      document.getElementById('aiResult').innerHTML = '';
      document.getElementById('aiStatus').textContent = `✅ 已加入${mealLabels[mealKey]}，下方可繼續調整。`;
      state.activeMeal = mealKey;
      renderMealTabs();
      renderSelected();
      updateTotals();
      markRecordChanged();
    }

    function rememberFoodUse(foodId) {
      const id = String(foodId || '');

      const ids = [id, ...recentFoodIds().filter(item => item !== id)].slice(0, 8);
      try {
        window.localStorage.setItem(`diet-food-recent:v2:${BOOTSTRAP.uid}`, JSON.stringify(ids));

    function frequentFoodList() {
      // 後端只會回傳「新功能啟用後」使用過一次的個人化項目，以及四個預設入口。
      // 舊版 localStorage 與舊的伺服器清單不再直接混入，避免快捷區回到八張卡片。
      const defaultFoods = [
        { id: 'common_yangtao_breakfast', name: '楊桃可口早餐', portion: '1份', kcal: 410, emoji: '🍽️', sort: 1 },
        { id: 'common_egg_sandwich', name: '煎蛋三明治', portion: '1份', kcal: 350, emoji: '🥪', sort: 2 },
        { id: 'common_overnight_oats', name: '隔夜燕麥粥', portion: '1碗', kcal: 300, emoji: '🥣', sort: 3 },
        { id: 'common_boiled_egg', name: '水煮蛋', portion: '1顆', kcal: 70, emoji: '🥚', sort: 4 },
      ];
      const byId = new Map(FOODS.map(food => [String(food.id), food]));
      const defaults = defaultFoods.map(defaultFood => {
        const food = byId.get(defaultFood.id);
        return food
          ? { ...food, name: defaultFood.name }
          : defaultFood;
      });
      const defaultIds = new Set(defaultFoods.map(food => food.id));
      // 後端回傳的個人化項目包含「食物庫選過的食物」與「直接輸入的食物」，兩者都只要使用過一次就能出現在這裡。
      const personalized = (Array.isArray(FREQUENT_FOODS) ? FREQUENT_FOODS : [])
        .filter(food => food && !defaultIds.has(String(food.id)))
        .map(food => Object.assign({ portion: '自行輸入', emoji: '✍️' }, food));
      return personalized.concat(defaults).slice(0, 4);
    }

        const categoryMatch = state.activeCategory === '全部' || food.category === state.activeCategory;
        const searchMatch = !state.search || `${food.name} ${food.portion} ${food.category}`.toLowerCase().includes(state.search);
        return categoryMatch && searchMatch;
      });
      root.innerHTML = '';
      Object.keys(foodCardNodes).forEach(foodId => { delete foodCardNodes[foodId]; });

      if (!foods.length) {
        const empty = el('div', 'selected-empty', '找不到符合的食物，可填在下方「其他熱量」。');
        empty.style.gridColumn = '1 / -1';
        root.append(empty);
        return;
      }

      foods.forEach(food => {
        const quantity = selected[food.id] || 0;
        const card = el('button', `food-card${quantity ? ' selected' : ''}`);
        card.type = 'button';
        const image = el('div', 'food-image');
        if (food.imageUrl) {
          const img = document.createElement('img');
          img.src = food.imageUrl;
          img.alt = food.name;
          img.loading = 'lazy';
          img.onerror = () => { image.textContent = food.emoji || '🍽️'; };
          image.append(img);
        } else image.textContent = food.emoji || '🍽️';

        card.append(image);
        card.append(el('span', 'food-name', food.name));
        card.append(el('span', 'food-meta', food.portion));
        card.append(el('span', 'food-kcal', `${food.kcal} kcal`));
        card.append(el('span', 'badge', `×${quantity}`));
        card.addEventListener('click', () => addFoodToActiveMeal(food));
        foodCardNodes[food.id] = card;
        root.append(card);
      });
    }

    function refreshFoodCard(foodId) {
      const card = foodCardNodes[foodId];
      if (!card) return;
      const quantity = Number((state.meals[state.activeMeal] || {})[foodId] || 0);
      card.classList.toggle('selected', quantity > 0);
      const badge = card.querySelector('.badge');
      if (badge) badge.textContent = `×${quantity}`;
    }

    function renderSelected() {
      const root = document.getElementById('selectedList');
      const selected = state.meals[state.activeMeal];
      const rows = Object.entries(selected).filter(([, quantity]) => quantity > 0);
      const aiRows = state.aiMeals[state.activeMeal] || [];
      document.getElementById('selectedTitle').textContent =
        `${mealLabels[state.activeMeal]}已選${mealHasItems(state.activeMeal) ? ' ✅' : ''}`;
      root.innerHTML = '';
      if (!rows.length && !aiRows.length) {
        root.append(el('div', 'selected-empty', '還沒有食物，可以拍照辨識或展開食物庫。'));
      } else {
        aiRows.forEach((item, index) => {
          const row = el('div', 'selected-row');
          const isManual = item.source === 'manual';
          if (!isManual) row.classList.add('selected-ai-row');
          const name = el('div', 'selected-name', `${isManual ? '✍️' : '🤖'} ${item.name}`);
          if (isManual) name.append(el('small', '', `${item.portion || '自行輸入'} · 可直接修改熱量`));
          else name.append(el('small', '', 'AI 辨識 · 點開可調整份量'));
          row.append(name);
          const kcal = document.createElement('input');
          kcal.className = 'ai-kcal';
          kcal.type = 'number';
          kcal.inputMode = 'numeric';
          kcal.min = '0';
          kcal.max = '5000';
          kcal.value = item.calories;
          kcal.setAttribute('aria-label', `${item.name}熱量`);
          kcal.addEventListener('input', event => {
            item.calories = Math.max(0, Number(event.target.value || 0));
            item.baseCalories = item.baseAmount > 0 ? item.baseCalories : item.calories;
            document.getElementById('mealTotal').textContent = mealTotal(state.activeMeal);
            renderMealTabs();
            updateTotals();
            markRecordChanged();
          });
          const remove = el('button', 'danger-small', '刪除');
          remove.type = 'button';
          remove.addEventListener('click', () => {
            state.aiMeals[state.activeMeal].splice(index, 1);
            renderMealTabs();
            renderSelected();
            updateTotals();
            markRecordChanged();
          });
          row.append(kcal, remove);
          if (!isManual) {
            const details = document.createElement('details');
            details.className = 'selected-ai-details';
            details.append(el('summary', '', '查看／調整份量與辨識細節'));
            const detailBody = el('div', 'selected-ai-detail-body');
            const detailMeta = el('div', 'ai-meta',
              `估計 ${item.amount || '?'} ${item.unit || 'g'} · 範圍 ${item.low || 0}～${item.high || 0} kcal · 信心 ${item.confidence || '低'}${item.notes ? `\n${item.notes}` : ''}`
            );
            appendPortionEditor(detailBody, item, () => {
              kcal.value = item.calories;
              detailMeta.textContent = `估計 ${item.amount || '?'} ${item.unit || 'g'} · 範圍 ${item.low || 0}～${item.high || 0} kcal · 信心 ${item.confidence || '低'}${item.notes ? `\n${item.notes}` : ''}`;
              document.getElementById('mealTotal').textContent = mealTotal(state.activeMeal);
              renderMealTabs();
              updateTotals();
              markRecordChanged();
            });
            detailBody.append(detailMeta);
            details.append(detailBody);
            row.append(details);
          }
          root.append(row);
        });

        rows.forEach(([foodId, quantity]) => {
          const food = FOOD_BY_ID[foodId];
          if (!food) return;
          const row = el('div', 'selected-row');
          const name = el('div', 'selected-name', `${food.emoji || '🍽️'} ${food.name}`);
          name.append(el('small', '', `${food.portion} · ${food.kcal * quantity} kcal`));
          const counter = el('div', 'counter');
          const minus = el('button', '', '−');
          minus.type = 'button';
          minus.addEventListener('click', () => changeQuantity(foodId, -1));
          const count = el('strong', '', String(quantity));
          const plus = el('button', '', '+');
          plus.type = 'button';
          plus.addEventListener('click', () => changeQuantity(foodId, 1));
          counter.append(minus, count, plus);
          row.append(name, counter);
          root.append(row);
        });
      }
      document.getElementById('mealTotal').textContent = mealTotal(state.activeMeal);
    }

    function changeQuantity(foodId, delta) {
      const selected = state.meals[state.activeMeal];
      selected[foodId] = Math.max(0, (selected[foodId] || 0) + delta);
      if (!selected[foodId]) delete selected[foodId];
      renderFrequentFoods();
      refreshFoodCard(foodId);
      renderMealTabs();
      renderSelected();
      updateTotals();
      markRecordChanged();
    }

    function mealTotal(mealKey) {
      const libraryTotal = Object.entries(state.meals[mealKey]).reduce((sum, [foodId, quantity]) => {
        const food = FOOD_BY_ID[foodId];
        return sum + (food ? food.kcal * quantity : 0);
      }, 0);
      const aiTotal = (state.aiMeals[mealKey] || []).reduce(
        (sum, item) => sum + Math.max(0, Number(item.calories || 0)),
        0
      );
      return Math.round(libraryTotal + aiTotal);
    }

    function grandTotal() {
      const foodTotal = Object.keys(mealLabels).reduce((sum, key) => sum + mealTotal(key), 0);
      return Math.max(0, Math.round(foodTotal));
    }

    function updateTotals() {
      const total = grandTotal();
      const bmr = Math.max(0, Number(document.getElementById('bmr').value || 0));
      const exerciseKcal = exerciseSummary().kcal;
      const estimatedTdee = bmr ? Math.round(bmr * 1.2 + exerciseKcal) : 0;
      document.getElementById('heroTotal').textContent = total;
      document.getElementById('heroTdee').textContent = estimatedTdee || '—';
      bottomTotal.textContent = total;
    }

    function serializeMeals() {
      const result = {};
      Object.keys(mealLabels).forEach(mealKey => {
        result[mealKey] = Object.entries(state.meals[mealKey])
          .filter(([, quantity]) => quantity > 0)
          .map(([id, quantity]) => ({ id, quantity }));
      });
      return result;
    }

    function serializeAiMeals() {
      const result = {};
      Object.keys(mealLabels).forEach(mealKey => {
        result[mealKey] = (state.aiMeals[mealKey] || [])
          .filter(item => item.name && Number(item.calories) > 0)
          .map(item => ({
            id: item.id,
            source: item.source === 'manual' ? 'manual' : 'gemini',
            name: item.name,
            portion: item.portion,
            grams: Math.round(Number(item.grams || (item.unit === 'g' ? item.amount : 0) || 0)),
            amount: Math.round(Number(item.amount || 0)),
            baseAmount: Math.round(Number(item.baseAmount || 0)),
            unit: item.unit === 'ml' ? 'ml' : 'g',
            baseCalories: Math.round(Number(item.baseCalories || item.calories || 0)),
            baseLow: Math.round(Number(item.baseLow || item.low || item.calories || 0)),
            baseHigh: Math.round(Number(item.baseHigh || item.high || item.calories || 0)),
            calories: Math.round(Number(item.calories)),
            confidence: item.confidence,
            notes: item.notes,
          }));
      });
      return result;
    }

    function updateSubmitButtons() {
      // 背景自動儲存時仍允許按「送出完成」；若請求正在進行，會排在下一筆送出。
      const isBackfill = state.recordDate !== BOOTSTRAP.today;
      updateRecordStatusTag();
      if (state.userSubmitPending) {
        submitButton.disabled = true;
        submitButton.textContent = isBackfill ? '補登送出中…' : '打卡送出中…';
        saveStatus.textContent = isBackfill ? '正在儲存並完成補登…' : '正在儲存並完成打卡…';
        return;
      }
      submitButton.disabled = todayIsComplete;
      submitButton.textContent = todayIsComplete
        ? (isBackfill ? '✅ 這天已補登' : '✅ 今日已完成')
        : (isBackfill ? '送出補登完成' : '送出打卡完成');
      saveStatus.textContent = todayIsComplete
        ? (isBackfill ? '✅ 補登已完成' : '✅ 已完成')
        : (state.saveInFlight ? '自動儲存中…' : (isBackfill ? '🕘 補登中・自動儲存' : '📝 打卡中・自動儲存'));
    }

    function updateRecordStatusTag() {
      const tag = document.querySelector('.record-status-tag');
      if (!tag) return;
      const isBackfill = state.recordDate !== BOOTSTRAP.today;
      const complete = Boolean(todayIsComplete);
      tag.textContent = complete
        ? (isBackfill ? '✅ 已完成補登' : '✅ 今日已完成')
        : (activeSavedLog ? (isBackfill ? '🕘 補登中' : '📝 打卡中') : '尚未開始');
      tag.classList.toggle('complete', complete);
      tag.classList.toggle('editing', !complete);
    }

    function setSavingState(saving) {
      state.userSubmitPending = Boolean(saving);
      updateSubmitButtons();
    }

    function markRecordChanged(saveDelayMs) {
      const changedFromComplete = todayIsComplete;

      todayIsComplete = false;
      state.pendingAutoComplete = false;
      state.mealRevision += 1;

      updateSubmitButtons();

      const delay = Number.isFinite(saveDelayMs)
        ? saveDelayMs
        : (changedFromComplete ? 350 : 1200);

      window.clearTimeout(state.autoSaveTimer);

      state.autoSaveTimer = window.setTimeout(
        () => submitLog(false, true),
        delay
      );

      if (changedFromComplete) {
        showToast(state.recordDate === BOOTSTRAP.today
          ? '📝 內容已修改，已切回打卡中並自動儲存。'
          : '🕘 補登內容已修改，已切回補登中並自動儲存。');
      }
    }

    function markPublicSettingsChanged(silent) {
      state.mealRevision += 1;
      state.pendingAutoComplete = todayIsComplete;
      window.clearTimeout(state.autoSaveTimer);
      updateSubmitButtons();
      state.autoSaveTimer = window.setTimeout(
        () => submitLog(todayIsComplete, true),
        900
      );
      if (!silent) {
        showToast('🌏 公開設定將自動儲存；群組排行不受影響。');
      }
    }

    function finishSave(requestRevision) {
      state.saveInFlight = false;
      state.savedMealRevision = Math.max(state.savedMealRevision, requestRevision);
      if (state.queuedUserSave !== null) {
        const nextComplete = state.queuedUserSave;
        state.queuedUserSave = null;
        submitLog(nextComplete, false);
        return true;
      }
      if (state.mealRevision > state.savedMealRevision) {
        window.clearTimeout(state.autoSaveTimer);
        state.autoSaveTimer = window.setTimeout(
          () => submitLog(Boolean(state.pendingAutoComplete), true),
          650
        );
      } else if (state.pendingDateSwitch) {
        const targetDate = state.pendingDateSwitch;
        state.pendingDateSwitch = '';
        loadRecordDate(targetDate);
        return true;
      }
      return false;
    }

    function requestRecordDateSwitch(recordDate) {
      recordDate = String(recordDate || '');
      if (!recordDate || recordDate === state.recordDate || state.loadingRecordDate) return;
      window.clearTimeout(state.autoSaveTimer);
      if (state.saveInFlight || state.mealRevision > state.savedMealRevision) {
        state.pendingDateSwitch = recordDate;
        showToast('💾 先儲存目前進度，接著會自動切換日期。');
        if (!state.saveInFlight) submitLog(todayIsComplete, true);
        return;
      }
      loadRecordDate(recordDate);
    }

    function loadRecordDate(recordDate) {
      if (Object.prototype.hasOwnProperty.call(DAILY_LOGS, recordDate)) {
        applyLoadedRecordDate(recordDate, DAILY_LOGS[recordDate]);
        return;
      }
      state.loadingRecordDate = true;
      document.querySelectorAll('[data-record-date]').forEach(button => { button.disabled = true; });
      saveStatus.textContent = '正在載入指定日期…';
      google.script.run
        .withSuccessHandler(result => {
          state.loadingRecordDate = false;
          const loadedDate = String(result.date || recordDate);
          DAILY_LOGS[loadedDate] = result.log || null;
          applyLoadedRecordDate(loadedDate, DAILY_LOGS[loadedDate]);
        })
        .withFailureHandler(error => {
          state.loadingRecordDate = false;
          document.querySelectorAll('[data-record-date]').forEach(button => { button.disabled = false; });
          updateSubmitButtons();
          showToast(`日期載入失敗：${error && error.message ? error.message : error}`);
        })
        .getDailyFormForDate({
          uid: BOOTSTRAP.uid,
          sig: BOOTSTRAP.sig,
          recordDate,
        });
    }

    function applyLoadedRecordDate(recordDate, savedLog) {
      state.loadingRecordDate = false;
      state.recordDate = String(recordDate || BOOTSTRAP.today);
      state.recordDatePickerOpen = false;
      state.mealRevision = 0;
      state.savedMealRevision = 0;
      state.pendingAutoComplete = false;
      hydrateStateFromDailyLog(savedLog);
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function submitLog(markComplete, automatic) {
      automatic = Boolean(automatic);
      if (state.saveInFlight) {
        if (!automatic) {
          state.queuedUserSave = Boolean(markComplete);
          // 背景儲存已在進行時，介面仍只顯示一個「送出中」狀態。
          // 第一筆結束後會立即送出完成狀態，不再顯示「排程送出中」。
          setSavingState(true);
        }
        return;
      }
      const bmr = Number(document.getElementById('bmr').value || 0);
      if (markComplete && !bmr) {
        if (!automatic) setSavingState(false);
        showToast('請先填寫 BMR，或使用「不知道基礎代謝？幫我估算」。');
        document.getElementById('bmrHelper').open = true;
        return;
      }
      if (markComplete && grandTotal() <= 0) {
        if (!automatic) setSavingState(false);
        showToast('請先拍照辨識食物，或手動填寫食物熱量。');
        return;
      }

      const exercise = exerciseSummary();
      const payload = {
        uid: BOOTSTRAP.uid,
        sig: BOOTSTRAP.sig,
        recordDate: state.recordDate,
        name: document.getElementById('name').value,
        bmr,
        meals: serializeMeals(),
        aiMeals: serializeAiMeals(),
        extraKcal: 0,
        waterEnabled: state.waterEnabled,
        waterGoalMl: state.waterGoalMl,
        waterMl: state.waterEnabled ? state.waterMl : 0,
        exerciseName: exercise.name,
        exerciseMinutes: exercise.minutes,
        exerciseKcal: exercise.kcal,
        exerciseRecords: exercise.records,
        note: '',
        isComplete: Boolean(markComplete),
        publicAlias: document.getElementById('publicAlias').value,
        publishToday: document.getElementById('publishToday').checked,
        publishFoodDetails: document.getElementById('publishFoodDetails').checked,
        joinPublicRanking: document.getElementById('joinPublicRanking').checked,
      };

      const requestRevision = state.mealRevision;
      const requestSignature = JSON.stringify(payload);
      if (automatic && requestSignature === state.lastSavedSignature) {
        state.savedMealRevision = Math.max(state.savedMealRevision, requestRevision);
        updateSubmitButtons();
        return;
      }
      state.saveInFlight = true;
      state.activeSaveSignature = requestSignature;
      window.clearTimeout(state.autoSaveTimer);
      if (!automatic) setSavingState(true);
      else updateSubmitButtons();
      google.script.run
        .withSuccessHandler(result => {
          state.lastSavedSignature = requestSignature;
          state.activeSaveSignature = '';
          todayIsComplete = Boolean(result.isComplete);
          const savedSnapshot = {
            exists: true,
            meals: payload.meals,
            aiMeals: payload.aiMeals,
            extraKcal: 0,
            waterEnabled: Boolean(payload.waterEnabled),
            waterGoalMl: Number(payload.waterGoalMl || 2000),
            waterMl: Number(payload.waterMl || 0),
            exerciseName: payload.exerciseName,
            exerciseMinutes: payload.exerciseMinutes,
            exerciseKcal: payload.exerciseKcal,
            exerciseRecords: payload.exerciseRecords,
            note: '',
            isComplete: todayIsComplete,
            isPublic: Boolean(payload.publishToday),
            publishFoodDetails: Boolean(payload.publishFoodDetails),
          };
          DAILY_LOGS[state.recordDate] = savedSnapshot;
          activeSavedLog = savedSnapshot;
          MEMBER.name = payload.name;
          MEMBER.bmr = payload.bmr;
          MEMBER.publicAlias = payload.publicAlias;
          MEMBER.defaultPublishToday = payload.publishToday;
          MEMBER.defaultPublishFoodDetails = payload.publishFoodDetails;
          MEMBER.joinPublicRanking = payload.joinPublicRanking;
          WATER_SETTINGS.enabled = Boolean(payload.waterEnabled);
          WATER_SETTINGS.goalMl = Number(payload.waterGoalMl || 2000);
          const startedQueuedSave = finishSave(requestRevision);
          if (startedQueuedSave) return;
          if (!automatic) setSavingState(false);
          else updateSubmitButtons();
          if (automatic) return;
          if (!result.isComplete) {
            showToast(`📝 已儲存目前進度（${result.totalIntake} kcal），目前仍為打卡中。`);
            return;
          }
          const deficit = result.hasBmr
            ? (result.estimatedDeficit >= 0 ? `估算赤字 ${result.estimatedDeficit} kcal` : `估算超出 ${Math.abs(result.estimatedDeficit)} kcal`)
            : '已儲存，待設定基礎代謝';
          showToast(`${result.isBackfill ? '✅ 補登完成' : '✅ 已完成'}！攝取 ${result.totalIntake} kcal，${deficit}`);
        })
        .withFailureHandler(error => {
          state.saveInFlight = false;
          state.activeSaveSignature = '';
          state.pendingDateSwitch = '';
          const queuedComplete = state.queuedUserSave;
          state.queuedUserSave = null;
          if (queuedComplete !== null) {
            submitLog(queuedComplete, false);
            return;
          }
          if (!automatic || state.userSubmitPending) setSavingState(false);
          else updateSubmitButtons();
          showToast(`儲存失敗：${error && error.message ? error.message : error}`);
        })
        .saveDailyLog(payload);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 4200);
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[char]);
    }

    function escapeAttr(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }
  </script>
  <script>
    if (!window.__dietAppReady && !window.__dietAppFailed) {
      window.__dietAppTimer = window.setTimeout(window.__dietShowTimeout, 3000);
    }
  </script>
</body>
