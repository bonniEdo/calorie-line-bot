<!doctype html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>個人設定</title>
  <style>
    :root { --cream:#fffaf0; --ink:#332f29; --muted:#776f64; --line:#eadfca; --yellow:#f5d77a; --green:#4e8b69; --blue:#e8f6ff; --blue-line:#8bc9e8; --white:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--cream); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; }
    button, input { font:inherit; touch-action:manipulation; }
    .app { max-width:760px; margin:0 auto; padding:16px 14px 100px; }
    .hero { padding:20px; border-radius:23px; background:linear-gradient(135deg,#ffe9a8,#f6d76e); box-shadow:0 10px 28px rgba(85,65,28,.1); }
    .eyebrow { color:#765c17; font-size:11px; font-weight:900; letter-spacing:.12em; }
    h1 { margin:6px 0 4px; font-size:26px; line-height:1.2; }
    .hero p { margin:0; color:#6b571f; font-size:13px; line-height:1.55; }
    .section { margin-top:14px; padding:15px; border:1px solid var(--line); border-radius:19px; background:var(--white); box-shadow:0 6px 18px rgba(85,65,28,.05); }
    .section h2 { margin:0; font-size:17px; }
    .section > p { margin:5px 0 0; color:var(--muted); font-size:12px; line-height:1.55; }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:13px; }
    label { display:block; color:var(--muted); font-size:12px; font-weight:800; }
    input { width:100%; min-height:43px; margin-top:5px; padding:9px 10px; border:1px solid var(--line); border-radius:11px; background:#fffdf9; color:var(--ink); }
    input:focus { outline:0; border-color:#d6a42c; box-shadow:0 0 0 3px rgba(230,188,66,.16); }
    .form-grid > label, .form-grid input { min-width:0; }
    .activity-options { min-width:0; margin:16px 0 0; padding:0; border:0; }
    .activity-options legend { padding:0; color:var(--ink); font-size:13px; font-weight:900; }
    .activity-options .hint { margin:4px 0 9px; }
    .activity-choice { position:relative; display:flex; align-items:center; gap:10px; min-height:52px; margin-top:7px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:#fffdf9; cursor:pointer; }
    .activity-choice:has(input:checked) { border-color:#d6a42c; background:#fff3c9; color:#76500c; }
    .activity-choice:focus-within { outline:2px solid #d6a42c; outline-offset:2px; }
    .activity-choice input { flex:0 0 18px; width:18px; height:18px; min-height:0; margin:0; padding:0; accent-color:#a77712; box-shadow:none; }
    .activity-choice strong { flex:1; min-width:0; font-size:13px; line-height:1.5; }
    .activity-choice span { flex:0 0 auto; padding:4px 8px; border-radius:8px; background:rgba(245,215,122,.22); font-size:12px; }
    .custom-protein { margin-top:14px; }
    .custom-protein small { display:block; margin-top:5px; font-size:11px; font-weight:400; line-height:1.5; }
    .protein-target-head { flex-wrap:wrap; }
    .privacy-note { margin-top:10px; padding:9px 10px; border-radius:11px; background:#f1f8f3; color:#35684b; font-size:11px; font-weight:800; line-height:1.5; }
    .protein-target { margin-top:12px; padding:12px; border:1px solid #c8e2d0; border-radius:15px; background:#f6fbf7; }
    .protein-target-head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
    .protein-target-head strong { color:#2f6b47; font-size:15px; }
    .protein-target-head span { color:#4e8b69; font-size:12px; font-weight:900; text-align:right; }
    .protein-target small { display:block; margin-top:7px; color:#5f7968; font-size:11px; line-height:1.5; }
    .toggle-list { display:grid; gap:8px; margin-top:12px; }
    .toggle { display:flex; align-items:flex-start; gap:10px; padding:10px 11px; border:1px solid #dfe9e1; border-radius:13px; background:#fbfefb; color:var(--ink); cursor:pointer; }
    .toggle input { width:20px; height:20px; min-height:0; margin:0; flex:0 0 auto; accent-color:var(--green); }
    .toggle strong { display:block; font-size:13px; }
    .toggle small { display:block; margin-top:2px; color:var(--muted); font-size:11px; line-height:1.4; }
    .save-row { position:sticky; bottom:78px; z-index:4; display:flex; align-items:center; gap:10px; margin-top:14px; padding:9px; border:1px solid #dfc979; border-radius:15px; background:rgba(255,250,240,.94); backdrop-filter:blur(10px); }
    .save-status { flex:1; min-width:0; color:var(--muted); font-size:11px; font-weight:800; line-height:1.4; }
    .primary { min-height:43px; padding:8px 13px; border:0; border-radius:12px; background:var(--ink); color:#fff; font-weight:900; white-space:nowrap; cursor:pointer; }
    .primary:disabled { opacity:.6; cursor:wait; }
    .space-list { display:grid; gap:9px; margin-top:12px; }
    .space-card { padding:11px; border:1px solid #d8e5df; border-radius:14px; background:#f8fcf9; }
    .space-card.owner { border-color:#e5ca70; background:#fffaf0; }
    .space-head { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
    .space-head strong { font-size:14px; }
    .space-count { padding:3px 7px; border-radius:999px; background:#e8f6ff; color:#245f7d; font-size:11px; font-weight:900; white-space:nowrap; }
    .space-card p { margin:5px 0 0; color:var(--muted); font-size:11px; line-height:1.45; }
    .invite { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-top:9px; }
    code { padding:6px 8px; border-radius:8px; background:#fff; color:#765c17; font-size:13px; font-weight:900; letter-spacing:.04em; }
    .actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:9px; }
    .secondary, .danger { min-height:34px; padding:6px 9px; border-radius:10px; background:#fff; font-size:11px; font-weight:900; cursor:pointer; }
    .secondary { border:1px solid #8bc9e8; color:#245f7d; }
    .danger { border:1px solid #e6aaa1; color:#ad4f46; }
    .space-create { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:end; margin-top:12px; }
    .space-create button { min-height:43px; white-space:nowrap; }
    .hint { margin:10px 0 0; color:var(--muted); font-size:11px; line-height:1.5; }
    .bottom-nav { position:fixed; right:0; bottom:0; left:0; z-index:10; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:3px; padding:7px 9px calc(7px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:rgba(255,250,240,.96); backdrop-filter:blur(14px); }
    .bottom-nav a { display:flex; min-height:49px; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:11px; color:#786f62; font-size:10px; font-weight:900; text-decoration:none; }
    .bottom-nav a span { font-size:17px; line-height:1; }
    .bottom-nav a.active { background:#fff1ba; color:#76500c; }
    .bottom-nav a.is-loading { background:#fff3c9; color:#76500c; }
    .bottom-nav a.is-loading span { animation:nav-pulse .65s ease-in-out infinite; }
    @keyframes nav-pulse { 50% { transform:scale(.84); opacity:.55; } }
    .toast { position:fixed; left:50%; bottom:78px; z-index:20; max-width:calc(100% - 36px); padding:11px 14px; border-radius:13px; background:rgba(51,47,41,.94); color:#fff; font-size:12px; font-weight:800; text-align:center; opacity:0; pointer-events:none; transform:translate(-50%,10px); transition:opacity .18s,transform .18s; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .error { padding:24px 16px; border:1px solid #e6aaa1; border-radius:18px; background:#fff5f2; color:#a64a42; text-align:center; line-height:1.6; }
    @media (max-width:430px) { .app { padding:12px 10px 96px; } .form-grid { grid-template-columns:1fr; } .save-row { bottom:73px; } }
  </style>
</head>
<body>
  <main id="app" class="app"><div class="error">正在載入個人設定…</div></main>
  <div id="personalData" hidden><?= personalJson ?></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    let DATA;
    const app = document.getElementById('app');
    const toast = document.getElementById('toast');
    const dirtyFields = new Set();
    let settingsSaving = false;
    try { DATA = JSON.parse(document.getElementById('personalData').textContent || '{}'); }
    catch (error) { DATA = { valid:false, invalidReason:'invalid' }; }

    function escapeHtml(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[char]); }
    function escapeAttr(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }
    function proteinNumber(value) { const grams = Math.max(0, Number(value || 0)); return Number.isInteger(grams) ? String(grams) : grams.toFixed(1).replace(/\.0$/, ''); }
    function checked(value) { return value ? ' checked' : ''; }
    function showToast(message) { toast.textContent = message; toast.classList.add('show'); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove('show'), 3000); }

    function bottomNav(nav) {
      return '<nav class="bottom-nav" aria-label="主要導覽">'
        + '<a href="' + escapeAttr(nav.formUrl || '#') + '" target="_top" data-spa-view="form"><span>📝</span>打卡</a>'
        + '<a href="' + escapeAttr(nav.publicWallUrl || '#') + '" target="_top"><span>🌐</span>紀錄牆</a>'
        + '<a href="' + escapeAttr(nav.historyUrl || '#') + '" target="_top" data-spa-view="history"><span>📈</span>歷史</a>'
        + '<a class="active" href="' + escapeAttr(nav.personalSettingsUrl || '#') + '" target="_top" data-spa-view="personal"><span>⚙️</span>設定</a>'
        + '</nav>';
    }

    function requestSpaNavigation(view, extra) {
      if (!window.dietApp) return false;
      window.dietApp.navigate(view, extra || {});
      return true;
    }

    function fieldSnapshot() {
      return Array.from(app.querySelectorAll('input')).map((node, index) => ({
        key:node.id || node.name + ':' + node.value, index, value:node.value, checked:node.checked,
      }));
    }

    function updateSettings(next) {
      if (settingsSaving) return false;
      const preserved = fieldSnapshot().filter(item => dirtyFields.has(item.key));
      const scroll = window.scrollY;
      DATA = next;
      if (window.dietApp) window.dietApp.spacesUpdated(next);
      render();
      const fields = app.querySelectorAll('input');
      preserved.forEach(item => {
        const node = Array.from(fields).find(field => (field.id || field.name + ':' + field.value) === item.key);
        if (node) { node.value = item.value; node.checked = item.checked; }
      });
      refreshProteinTargetPreview();
      document.getElementById('publishFoodDetails').disabled = !document.getElementById('publishToday').checked;
      window.scrollTo({ top:scroll, behavior:'auto' });
    }

    function proteinTargetText(weight, target, activityLevel) {
      const custom = Math.max(0, Number(target || 0));
      const kg = Math.max(0, Number(weight || 0));
      const activity = {
        general: { multiplier: 1.2, label: '一般活動' },
        active: { multiplier: 1.5, label: '規律運動' },
        strength: { multiplier: 1.8, label: '重訓／增肌／減脂' },
      }[activityLevel] || { multiplier: 1.2, label: '一般活動' };
      if (custom > 0) return { value: custom, text: '自訂每日目標' };
      if (kg >= 20) return { value: Math.round(kg * activity.multiplier * 10) / 10, text: activity.label + '・依體重 × ' + activity.multiplier + ' g 建議' };
      return { value: 0, text: '請設定體重或自訂克數' };
    }

    // Apps Script 會把畫面放在內嵌框架；不能依賴 location.search 還保有外層網址的 uid／sig。
    // 這組短期表單憑證由伺服器隨個人設定資料一併提供，與打卡頁的驗證方式一致。
    function accessPayload() {
      const fallback = new URLSearchParams(location.search);
      const auth = DATA.auth || {};
      return {
        uid: String(auth.uid || fallback.get('uid') || ''),
        sig: String(auth.sig || fallback.get('sig') || ''),
      };
    }

    function renderSpaces() {
      const spaces = Array.isArray(DATA.checkInSpaces) ? DATA.checkInSpaces : [];
      const cards = spaces.map(space => {
        const owner = Boolean(space.isOwner);
        const detail = owner
          ? '<div class="invite"><span>邀請碼</span><code>' + escapeHtml(space.inviteCode || '—') + '</code></div><p>有效到 ' + escapeHtml(space.inviteExpiresAt || '—') + '。好友加入官方帳號後，直接傳邀請碼即可加入。</p><div class="actions"><button class="secondary" type="button" data-copy="' + escapeAttr(space.inviteCode || '') + '">複製邀請碼</button><button class="danger" type="button" data-renew="' + escapeAttr(space.groupId || '') + '">重設邀請碼</button></div>'
          : '<p>可在猛猛紀錄牆的群組分頁查看大家主動分享的紀錄。</p><div class="actions"><button class="danger" type="button" data-leave="' + escapeAttr(space.groupId || '') + '">離開空間</button></div>';
        return '<article class="space-card' + (owner ? ' owner' : '') + '"><div class="space-head"><strong>' + escapeHtml(space.name || '未命名打卡空間') + '</strong><span class="space-count">' + Math.max(0, Number(space.memberCount || 0)) + ' 人</span></div>' + detail + '</article>';
      }).join('');
      return '<section class="section"><h2>👥 打卡空間</h2><p>不用建立 LINE 群組，也能邀請朋友一起看猛猛紀錄牆。</p><div class="space-create"><label>新增打卡空間<input id="spaceName" maxlength="40" placeholder="例如：晚餐不爆卡小隊"></label><button id="createSpace" class="secondary" type="button">建立空間</button></div>' + (cards ? '<div class="space-list">' + cards + '</div>' : '<p class="hint">尚未加入任何打卡空間。</p>') + '</section>';
    }

    function render() {
      if (!DATA.valid) {
        app.innerHTML = '<div class="error"><strong>個人設定連結無效</strong><br>請回 LINE 輸入「打卡」取得新連結。</div>';
        return;
      }
      const member = DATA.member || {};
      const profile = DATA.profile || {};
      const reminders = DATA.reminders || {};
      const groups = Array.isArray(DATA.groupWalls) ? DATA.groupWalls : [];
      const target = proteinTargetText(profile.weightKg, profile.proteinTargetG, profile.proteinActivityLevel);
      app.innerHTML = [
        '<section class="hero"><div class="eyebrow">PERSONAL SETTINGS</div><h1>👤 個人設定</h1><p>在這裡管理消耗熱量、蛋白質目標、分享與 LINE 提醒。</p></section>',
        '<section class="section"><h2>⚡ 消耗與蛋白質</h2><p>BMR 會用於打卡頁的可消耗熱量估算；體重只保存在你的私密設定，不會寫入 Google Sheet。</p>',
          '<div class="form-grid">',
            '<label>顯示名稱<input id="name" maxlength="40" value="' + escapeAttr(member.name || '') + '"></label>',
            '<label>基礎代謝 BMR（kcal）<input id="bmr" type="number" inputmode="numeric" min="500" max="5000" value="' + escapeAttr(member.bmr || '') + '" placeholder="例如 1334"></label>',
          '</div>',
          '<label class="custom-protein">體重（kg）<input id="weightKg" type="number" inputmode="decimal" min="20" max="500" step="0.1" value="' + escapeAttr(profile.weightKg || '') + '" placeholder="例如 60"></label>',
          '<fieldset class="activity-options"><legend>活動程度</legend><p class="hint">選擇平常的活動習慣，依體重計算每日蛋白質目標。</p>',
          '<input id="proteinActivityLevel" type="hidden" value="' + escapeAttr(profile.proteinActivityLevel || 'general') + '">',
          [['general', '一般活動', '1.2'], ['active', '規律運動', '1.5'], ['strength', '重訓／增肌／減脂', '1.8']].map(item => '<label class="activity-choice"><input type="radio" name="proteinActivity" value="' + item[0] + '"' + checked((profile.proteinActivityLevel || 'general') === item[0]) + '><strong>' + item[1] + '</strong><span>× ' + item[2] + ' g／kg</span></label>').join(''),
          '</fieldset>',
          '<label class="custom-protein">自訂蛋白質目標（選填，g／天）<input id="proteinTargetG" type="number" inputmode="decimal" min="0" max="500" step="0.1" value="' + escapeAttr(profile.proteinTargetG || '') + '" placeholder="留白，依活動程度計算"><small>填寫後優先使用自訂克數；清空即可恢復活動程度建議。</small></label>',
          '<div class="protein-target"><div class="protein-target-head"><strong>🥚 蛋白質進度條目標</strong><span id="proteinTargetPreview">' + proteinNumber(target.value) + (target.value ? ' g／天' : '尚未設定') + '</span></div><small id="proteinTargetHint">' + escapeHtml(target.text) + '。自訂克數優先於體重建議。</small></div>',
          '<div class="privacy-note">🔒 體重只保存在個人私密設定，用於運動與蛋白質估算；不會出現在 Google Sheet、公開牆、群組牆或其他人的頁面。</div>',
        '</section>',
        '<section class="section"><h2>🔔 LINE 提醒</h2><p>各時段可獨立開關；晚上 19:30 是最後通知。</p><div class="toggle-list">',
          '<label class="toggle"><input id="reminderMorning" type="checkbox"' + checked(reminders.morning) + '><span><strong>☀️ 早上提醒</strong><small>09:00</small></span></label>',
          '<label class="toggle"><input id="reminderNoon" type="checkbox"' + checked(reminders.noon) + '><span><strong>🌤️ 中午提醒</strong><small>12:00</small></span></label>',
          '<label class="toggle"><input id="reminderEvening" type="checkbox"' + checked(reminders.evening) + '><span><strong>🌙 最後通知</strong><small>19:30</small></span></label>',
        '</div></section>',
        '<section class="section"><h2>🌍 公開／空間分享</h2><p>這些設定會記住並套用到之後的新紀錄；空間／群組分享切換時，也會同步你既有的歷史紀錄。</p>',
          '<div class="form-grid"><label>公開暱稱<input id="publicAlias" maxlength="40" value="' + escapeAttr(member.publicAlias || member.name || '') + '" placeholder="例如：檸檬夥伴"></label></div>',
          '<div class="toggle-list">',
            '<label class="toggle"><input id="publishToday" type="checkbox"' + checked(member.defaultPublishToday) + '><span><strong>公開到猛猛紀錄牆</strong><small>只有你主動開啟才會顯示。</small></span></label>',
            '<label class="toggle"><input id="publishFoodDetails" type="checkbox"' + checked(member.defaultPublishFoodDetails) + '><span><strong>公開食物細項</strong><small>需同時開啟公開紀錄。</small></span></label>',
            '<label class="toggle"><input id="joinPublicRanking" type="checkbox"' + checked(member.joinPublicRanking) + '><span><strong>參加連續紀錄排行</strong><small>只顯示公開暱稱與連續天數。</small></span></label>',
            (groups.length ? '<label class="toggle"><input id="publishToGroup" type="checkbox"' + checked(member.defaultPublishToGroup) + '><span><strong>顯示在我的打卡空間／群組猛猛紀錄牆</strong><small>空間成員可看到食物細項；不等於公開到所有人。</small></span></label>' : ''),
          '</div>',
        '</section>',
        renderSpaces(),
        '<div class="save-row"><span id="saveStatus" class="save-status">更改後按儲存即可套用。</span><button id="saveSettings" class="primary" type="button">儲存設定</button></div>',
        bottomNav(DATA.nav || {}),
      ].join('');
      bindEvents();
    }

    function refreshProteinTargetPreview() {
      const preview = document.getElementById('proteinTargetPreview');
      const hint = document.getElementById('proteinTargetHint');
      const value = proteinTargetText(document.getElementById('weightKg').value, document.getElementById('proteinTargetG').value, document.getElementById('proteinActivityLevel').value);
      if (preview) preview.textContent = value.value ? proteinNumber(value.value) + ' g／天' : '尚未設定';
      if (hint) hint.textContent = value.text + '。自訂克數優先於體重建議。';
    }

    function bindEvents() {
      document.querySelectorAll('.bottom-nav a[href]').forEach(link => {
        if (!link.getAttribute('href') || link.getAttribute('href') === '#') return;
        link.addEventListener('click', event => {
          const view = link.dataset.spaView || '';
          if (view && requestSpaNavigation(view)) {
            event.preventDefault();
            return;
          }
          link.classList.add('is-loading');
          link.setAttribute('aria-busy', 'true');
        });
      });
      ['weightKg', 'proteinTargetG'].forEach(id => document.getElementById(id).addEventListener('input', refreshProteinTargetPreview));
      document.querySelectorAll('input[name="proteinActivity"]').forEach(input => input.addEventListener('change', () => {
        document.getElementById('proteinActivityLevel').value = input.value;
        refreshProteinTargetPreview();
      }));
      document.getElementById('publishToday').addEventListener('change', event => {
        const food = document.getElementById('publishFoodDetails');
        if (!event.target.checked) food.checked = false;
        food.disabled = !event.target.checked;
      });
      document.getElementById('publishFoodDetails').disabled = !document.getElementById('publishToday').checked;
      document.getElementById('saveSettings').addEventListener('click', saveSettings);
      document.getElementById('createSpace').addEventListener('click', createSpace);
      document.querySelectorAll('[data-copy]').forEach(button => button.addEventListener('click', () => copyInvite(button.dataset.copy || '')));
      document.querySelectorAll('[data-renew]').forEach(button => button.addEventListener('click', () => renewSpace(button.dataset.renew || '')));
      document.querySelectorAll('[data-leave]').forEach(button => button.addEventListener('click', () => leaveSpace(button.dataset.leave || '')));
    }

    async function saveSettings() {
      if (settingsSaving) return;
      const button = document.getElementById('saveSettings');
      const status = document.getElementById('saveStatus');
      const numberOrBlank = id => String(document.getElementById(id).value || '').trim();
      const member = {
        name: String(document.getElementById('name').value || '').trim(),
        bmr: numberOrBlank('bmr'),
        publicAlias: String(document.getElementById('publicAlias').value || '').trim(),
        joinPublicRanking: document.getElementById('joinPublicRanking').checked,
        defaultPublishToday: document.getElementById('publishToday').checked,
        defaultPublishFoodDetails: document.getElementById('publishFoodDetails').checked,
        defaultPublishToGroup: Boolean(document.getElementById('publishToGroup') && document.getElementById('publishToGroup').checked),
        reminders: {
          morning: document.getElementById('reminderMorning').checked,
          noon: document.getElementById('reminderNoon').checked,
          evening: document.getElementById('reminderEvening').checked,
        },
      };
      button.disabled = true;
      settingsSaving = true;
      status.textContent = '正在儲存…';
      // The new-space name is a separate action, not part of saving personal settings.
      const snapshot = fieldSnapshot().filter(item => item.key !== 'spaceName');
      const profile = { weightKg:numberOrBlank('weightKg'), proteinTargetG:numberOrBlank('proteinTargetG'), proteinActivityLevel:document.getElementById('proteinActivityLevel').value };
      try {
        if (window.dietApp) await window.dietApp.beforeSettingsSave();
      } catch (error) {
        settingsSaving = false;
        button.disabled = false;
        status.textContent = error.message;
        return;
      }
      google.script.run
        .withSuccessHandler(result => {
          settingsSaving = false;
          const current = fieldSnapshot();
          snapshot.forEach(item => {
            const field = current.find(value => value.key === item.key);
            if (field && field.value === item.value && field.checked === item.checked) dirtyFields.delete(item.key);
          });
          if (window.dietApp) window.dietApp.settingsSaved(result);
          updateSettings(result || DATA);
          showToast('✅ 個人設定已儲存');
        })
        .withFailureHandler(error => {
          settingsSaving = false;
          if (window.dietApp) window.dietApp.settingsFailed();
          button.disabled = false;
          status.textContent = '儲存失敗，請稍後再試。';
          showToast(error && error.message ? error.message : '儲存失敗，請稍後再試。');
        })
        .savePersonalSettingsForClient(Object.assign(accessPayload(), {
          member,
          profile,
        }));
    }

    function reloadSettings() {
      if (window.dietApp) { window.dietApp.spacesChanged(); return; }
      const url = DATA.nav && DATA.nav.personalSettingsUrl;
      if (url) window.top.location.href = url + '&refresh=' + Date.now();
      else window.location.reload();
    }

    function createSpace() {
      const input = document.getElementById('spaceName');
      const name = String(input.value || '').trim();
      if (!name) { showToast('請先輸入打卡空間名稱。'); input.focus(); return; }
      const button = document.getElementById('createSpace');
      button.disabled = true;
      google.script.run.withSuccessHandler(reloadSettings).withFailureHandler(error => { button.disabled = false; showToast(error && error.message ? error.message : '建立失敗'); })
        .createCheckInSpaceForClient(Object.assign(accessPayload(), { name }));
    }

    function renewSpace(groupId) {
      if (!groupId || !window.confirm('重設後，舊邀請碼會立刻失效。要繼續嗎？')) return;
      google.script.run.withSuccessHandler(reloadSettings).withFailureHandler(error => showToast(error && error.message ? error.message : '重設失敗'))
        .regenerateCheckInSpaceInviteForClient(Object.assign(accessPayload(), { groupId }));
    }

    function leaveSpace(groupId) {
      if (!groupId || !window.confirm('離開後將看不到這個空間的猛猛紀錄牆。確定要離開嗎？')) return;
      google.script.run.withSuccessHandler(reloadSettings).withFailureHandler(error => showToast(error && error.message ? error.message : '離開失敗'))
        .leaveCheckInSpaceForClient(Object.assign(accessPayload(), { groupId }));
    }

    function copyInvite(value) {
      if (!value) return;
      const done = () => showToast('已複製邀請碼：' + value);
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(value).then(done).catch(() => fallbackCopy(value, done));
      else fallbackCopy(value, done);
    }
    function fallbackCopy(value, done) { const input = document.createElement('textarea'); input.value = value; input.style.position = 'fixed'; input.style.opacity = '0'; document.body.append(input); input.select(); try { document.execCommand('copy'); done(); } catch (error) { showToast('請長按複製邀請碼：' + value); } input.remove(); }

    render();
    app.addEventListener('input', event => {
      const node = event.target;
      if (node.tagName === 'INPUT') dirtyFields.add(node.id || node.name + ':' + node.value);
      if (node.id === 'publishToday') dirtyFields.add('publishFoodDetails');
      if (node.name === 'proteinActivity') {
        dirtyFields.add('proteinActivityLevel');
        app.querySelectorAll('[name="proteinActivity"]').forEach(field => dirtyFields.add(field.name + ':' + field.value));
      }
    });
    if (window.dietApp) window.dietApp.register({ update:updateSettings });
  </script>
</body>
</html>
