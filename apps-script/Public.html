<!doctype html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --cream: #fffaf0;
      --yellow: #f5d77a;
      --ink: #332f29;
      --muted: #776f64;
      --green: #4e8b69;
      --amber: #d79a3c;
      --line: #eadfca;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }
    button { font: inherit; touch-action: manipulation; }
    .app { max-width: 760px; margin: 0 auto; padding: 16px 14px 48px; }

    .hero {
      padding: 18px 20px;
      border-radius: 22px;
      background: linear-gradient(135deg, #ffe9a8, #f6d76e);
      box-shadow: 0 10px 30px rgba(85, 65, 28, .10);
    }
    .eyebrow { font-size: 11px; font-weight: 900; letter-spacing: .12em; color: #765c17; }
    h1 { margin: 6px 0 4px; font-size: 23px; line-height: 1.2; }
    .hero p { margin: 0; color: #6b571f; font-size: 13px; line-height: 1.5; }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 13px; }
    .summary-card { padding: 9px 6px; border-radius: 13px; background: rgba(255,255,255,.72); text-align: center; }
    .summary-card strong { display: block; font-size: 18px; }
    .summary-card span { font-size: 11px; color: #765c17; }
    .page-nav { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:7px; margin-top:12px; }
    .page-nav a { min-height:42px; display:flex; align-items:center; justify-content:center; padding:8px 7px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); font-size:12px; font-weight:900; text-decoration:none; }
    .page-nav a[hidden] { display:none !important; }
    .page-nav a:first-child { border-color:#9fc7ae; background:#f0f8f2; color:#35684b; }

    /* 日期只留一個選擇器，避免四個按鈕和外框把畫面切得太碎。 */
    .date-toolbar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 7px 12px;
      margin-top: 14px;
      padding: 8px 2px 10px;
      border-bottom: 1px solid var(--line);
    }
    .date-toolbar-title { color: var(--muted); font-size: 12px; font-weight: 900; white-space: nowrap; }
    .date-toolbar-actions { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .date-select {
      min-height: 36px;
      width: 100%;
      min-width: 0;
      padding: 0 32px 0 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--white);
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }
    .date-today {
      flex: 0 0 auto;
      padding: 6px 0;
      border: 0;
      background: transparent;
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
      cursor: pointer;
    }
    .date-range-hint { grid-column: 1 / -1; color: #928879; font-size: 11px; line-height: 1.4; }

    /* 頁籤改成底線，不再套第二層大圓角卡片。 */
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 12px; border-bottom: 1px solid var(--line); }
    .tab { min-height: 40px; border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: transparent; color: var(--muted); font-weight: 900; cursor: pointer; }
    .tab.active { background: transparent; color: var(--ink); border-bottom-color: var(--amber); }
    .panel { margin-top: 12px; }

    /* 收合狀態只有一行：名字、熱量、讚、展開箭頭，再加一條細進度條。 */
    .person {
      margin-top: 8px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--white);
      overflow: hidden;
    }
    .person > summary {
      padding: 10px 13px;
      list-style: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .person > summary::-webkit-details-marker { display: none; }
    .person > summary:focus-visible { outline: 2px solid var(--green); outline-offset: -2px; }
    .person-row {
      min-height: 34px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto auto;
      align-items: center;
      gap: 9px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #dcd2c0; }
    .dot.complete { background: var(--green); }
    .person-name { min-width: 0; font-size: 15px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kcal { font-size: 15px; font-weight: 900; white-space: nowrap; letter-spacing: -.01em; }
    .kcal small { margin-left: 1px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .chevron { width: 14px; color: #b7ac9c; font-size: 11px; text-align: center; transition: transform .16s ease; }
    .person[open] .chevron { transform: rotate(180deg); }

    .bar { height: 5px; margin-top: 8px; border-radius: 999px; background: #f0eadf; overflow: hidden; }
    .bar > span { display: block; height: 100%; border-radius: inherit; background: var(--green); }
    .bar.over > span { background: var(--amber); }

    .person-body { padding: 0 13px 13px; }
    .person-meta {
      padding: 11px 0 0;
      border-top: 1px solid #f3ecde;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    .energy-line {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      margin-top: 7px;
      padding: 5px 8px;
      border-radius: 9px;
      background: #eef8f1;
      color: #35684b;
      font-size: 12px;
      font-weight: 900;
    }
    .energy-line small { color: #5b7865; font-size: 10px; font-weight: 700; }
    .meal-group { padding-top: 10px; }
    .meal-group + .meal-group { margin-top: 8px; border-top: 1px solid #f3ecde; }
    .meal-title { margin-bottom: 3px; color: var(--green); font-size: 12px; font-weight: 900; }
    .food-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      padding: 5px 0;
    }
    .food-name { min-width: 0; font-size: 13px; font-weight: 800; line-height: 1.4; }
    .food-meta { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; font-weight: 500; }
    .food-kcal { color: var(--ink); font-size: 12px; font-weight: 900; white-space: nowrap; }
    .no-details { padding-top: 10px; color: var(--muted); font-size: 12px; line-height: 1.6; }

    .rank-card { margin-top: 8px; padding: 4px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--white); }
    .rank-row {
      min-height: 56px;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 9px;
      border-bottom: 1px solid #f3ecde;
    }
    .rank-row:last-child { border-bottom: 0; }
    .place { text-align: center; font-weight: 900; }
    .rank-name { min-width: 0; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .streak { text-align: right; font-weight: 900; font-size: 14px; white-space: nowrap; }
    .streak small { display: block; color: var(--muted); font-size: 10px; font-weight: 700; }

    .like-button {
      min-height: 36px;
      padding: 5px 9px;
      border: 1px solid #e5ca70;
      border-radius: 11px;
      background: #fff9e6;
      color: #765c17;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }
    .like-button.liked { border-color: #8db89d; background: #e6f2e9; color: #35684b; }
    .like-button:disabled { cursor: default; opacity: .68; }

    .like-hint {
      margin-top: 12px;
      padding: 10px 13px;
      border-radius: 13px;
      background: #fff9e6;
      color: #765c17;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.5;
      text-align: center;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 20;
      max-width: calc(100% - 36px);
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(51, 47, 41, .94);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .empty {
      margin-top: 10px;
      padding: 20px 15px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--white);
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    /* 說明文字收進摺疊，需要的人點開就好，不用一直佔版面。 */
    .privacy { margin-top: 14px; border: 1px solid #cfe1d5; border-radius: 14px; background: #f4faf6; overflow: hidden; }
    .privacy summary { padding: 11px 13px; color: #35684b; font-size: 12px; font-weight: 900; cursor: pointer; list-style-position: inside; }
    .privacy p { margin: 0; padding: 0 13px 12px; color: #35684b; font-size: 12px; line-height: 1.65; }
    .updated { margin-top: 12px; color: #aaa094; font-size: 11px; text-align: center; }

    @media (max-width: 380px) {
      .app { padding-left: 10px; padding-right: 10px; }
      .hero { padding: 16px; }
      h1 { font-size: 21px; }
      .summary-card span { font-size: 10px; }
      .person-row { gap: 7px; }
      .person-name { font-size: 14px; }
      .kcal { font-size: 14px; }
      .rank-row { grid-template-columns: 28px minmax(0, 1fr) auto auto; gap: 6px; }
      .like-button { padding-left: 7px; padding-right: 7px; }
    }
    @media (max-width: 460px) {
      .date-toolbar { grid-template-columns: 1fr; gap: 6px; }
      .date-toolbar-actions { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="eyebrow">HEALTH LOG</div>
      <h1>🌏 公開飲控紀錄</h1>
      <p id="heroDate"></p>
      <div class="summary">
        <div class="summary-card"><strong id="publicCount">0</strong><span id="publicCountLabel">今日公開</span></div>
        <div class="summary-card"><strong id="completedCount">0</strong><span id="completedCountLabel">已完成</span></div>
        <div class="summary-card"><strong id="rankingCount">0</strong><span id="rankingCountLabel">參加連續排行</span></div>
      </div>
    </section>

    <nav class="page-nav" aria-label="頁面導覽">
      <a id="publicCheckinLink" href="#" target="_top" hidden>📝 我要打卡</a>
      <a id="publicHistoryLink" href="#" target="_top" hidden>📈 猛猛卡路里歷史</a>
    </nav>

    <section class="date-toolbar" aria-label="公開牆日期選擇">
      <div class="date-toolbar-title">📅 公開紀錄日期</div>
      <div class="date-toolbar-actions">
        <select id="publicDateSelect" class="date-select" aria-label="選擇公開紀錄日期"></select>
        <button id="publicDateToday" class="date-today" type="button">今天</button>
      </div>
      <div id="dateRangeHint" class="date-range-hint"></div>
    </section>

    <nav class="tabs" role="tablist" aria-label="公開功能頁籤">
      <button id="recordsTab" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="recordsPanel">公開紀錄</button>
      <button id="streaksTab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="streaksPanel">連續排行</button>
    </nav>

    <section id="recordsPanel" class="panel" role="tabpanel" aria-labelledby="recordsTab"></section>
    <section id="streaksPanel" class="panel" role="tabpanel" aria-labelledby="streaksTab" hidden></section>

    <div id="likeHint" class="like-hint"></div>

    <details class="privacy">
      <summary>🔒 本頁說明</summary>
      <p>這是自願公開區，每個人的公開設定預設都是關閉的。只有本人勾選公開時才會出現！</p>
    </details>
    <div id="updated" class="updated"></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!--
    伺服器資料以純文字節點傳入，再由 textContent 讀取。
    請保留目前的「跳脫後輸出」方式，不要改成未跳脫輸出，避免形成 HTML 注入點。
  -->
  <div id="publicData" hidden><?= publicJson ?></div>
  <script>
    window.__publicWallBuild = '2026.08.21-70';

    const toast = document.getElementById('toast');
    const recordsPanel = document.getElementById('recordsPanel');
    const streaksPanel = document.getElementById('streaksPanel');
    const likeHint = document.getElementById('likeHint');

    let DATA;
    try {
      DATA = JSON.parse(document.getElementById('publicData').textContent || '{}');
    } catch (error) {
      // 沒有這層保護的話，伺服器資料一有問題就是整頁全白，看不出發生什麼事。
      document.querySelector('.app').innerHTML =
        '<div class="empty"><strong>公開頁資料讀取失敗</strong><br>請關閉後回 LINE 重新輸入「公開紀錄」。<br>若持續發生，請截圖這段訊息。</div>';
      throw error;
    }

    let likeRequestInFlight = false;
    let dateRequestInFlight = false;
    let selectedDate = String(DATA.date || DATA.today || '');
    let selectedDateLabel = formatDateLabel(selectedDate);

    if (DATA.error) {
      document.querySelector('.app').innerHTML =
        '<div class="empty"><strong>公開牆資料讀取失敗</strong><br>'
        + escapeHtml(DATA.error)
        + '<br><small>請稍後再試；若持續發生，請把這段錯誤截圖給管理者。</small></div>';
      throw new Error(DATA.error);
    }

    document.getElementById('heroDate').textContent = `${selectedDateLabel}・只顯示本人主動公開的內容`;
    document.getElementById('publicCount').textContent = number(DATA.summary && DATA.summary.publicCount);
    document.getElementById('completedCount').textContent = number(DATA.summary && DATA.summary.completedCount);
    document.getElementById('rankingCount').textContent = number(DATA.summary && DATA.summary.rankingCount);
    document.getElementById('publicCountLabel').textContent = `${selectedDateLabel}公開`;
    document.getElementById('completedCountLabel').textContent = `${selectedDateLabel}已完成`;
    document.getElementById('rankingCountLabel').textContent = `${selectedDateLabel}排行`;
    document.getElementById('recordsTab').textContent = '公開紀錄';
    document.getElementById('streaksTab').textContent = '連續排行';
    document.getElementById('updated').textContent = `更新時間：${DATA.generatedAt || ''}`;

    initDatePicker();

    const publicNav = DATA.nav || {};
    const publicCheckinLink = document.getElementById('publicCheckinLink');
    const publicHistoryLink = document.getElementById('publicHistoryLink');
    if (publicNav.formUrl) {
      publicCheckinLink.href = publicNav.formUrl;
      publicCheckinLink.hidden = false;
    }
    if (publicNav.historyUrl) {
      publicHistoryLink.href = publicNav.historyUrl;
      publicHistoryLink.hidden = false;
    }

    function initDatePicker() {
      const select = document.getElementById('publicDateSelect');
      const todayButton = document.getElementById('publicDateToday');
      const minDate = String(DATA.minDate || '');
      const maxDate = String(DATA.maxDate || DATA.today || selectedDate);
      select.replaceChildren();

      // 以一個下拉選單取代多個日期按鈕；仍保留最近 30 天的查詢範圍。
      for (let offset = 0; offset < 30; offset += 1) {
        const targetDate = shiftDate(maxDate, offset);
        if (!targetDate || (minDate && targetDate < minDate)) break;
        const option = document.createElement('option');
        option.value = targetDate;
        const relativeLabel = offset === 0 ? '今天' : offset === 1 ? '昨天' : offset === 2 ? '前天' : formatDateLabel(targetDate);
        option.textContent = `${relativeLabel}（${formatDateLabel(targetDate)}）`;
        select.appendChild(option);
      }
      // 若資料日期剛好落在可查範圍外，仍保留目前日期，避免畫面沒有選取值。
      if (selectedDate && !Array.from(select.options).some(option => option.value === selectedDate)) {
        const option = document.createElement('option');
        option.value = selectedDate;
        option.textContent = formatDateLabel(selectedDate);
        select.appendChild(option);
      }
      select.value = selectedDate;
      select.onchange = () => navigateToDate(select.value);
      todayButton.onclick = () => navigateToDate(maxDate);
      document.getElementById('dateRangeHint').textContent = `可查 ${formatDateLabel(minDate)} ～ ${formatDateLabel(maxDate)} · 主動公開的紀錄。`;
    }

    function navigateToDate(date) {
      if (dateRequestInFlight) return;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(date || ''))) return;
      const minDate = String(DATA.minDate || '');
      const maxDate = String(DATA.maxDate || DATA.today || selectedDate);
      if ((minDate && date < minDate) || (maxDate && date > maxDate)) {
        showToast(`只能查 ${formatDateLabel(minDate)} ～ ${formatDateLabel(maxDate)}。`, 2200);
        return;
      }
      if (date === selectedDate) return;

      // 日期切換改成同頁請求：不重新載入整個 Apps Script iframe，
      // 因此不會因冷啟動、網路或舊版部署短暫白畫面。
      dateRequestInFlight = true;
      document.querySelectorAll('#publicDateSelect, #publicDateToday').forEach(control => {
        control.disabled = true;
      });
      showToast(`正在載入 ${formatDateLabel(date)} 公開紀錄…`, 30000);
      google.script.run
        .withSuccessHandler(nextData => {
          dateRequestInFlight = false;
          document.querySelectorAll('#publicDateSelect, #publicDateToday').forEach(control => {
            control.disabled = false;
          });
          if (!nextData || nextData.error) {
            showToast(nextData && nextData.error ? nextData.error : '公開紀錄載入失敗，請稍後再試。', 3000);
            return;
          }
          DATA = nextData;
          selectedDate = String(DATA.date || date);
          selectedDateLabel = formatDateLabel(selectedDate);
          try {
            const url = new URL(window.location.href);
            url.searchParams.set('date', selectedDate);
            window.history.replaceState({}, '', url.toString());
          } catch (historyError) {
            // Apps Script 某些內嵌瀏覽器不允許改 iframe history；不影響資料畫面更新。
          }
          refreshDateView();
          renderRecords();
          renderStreaks();
          updateLikeHint();
          showToast(`已切換到 ${selectedDateLabel}`, 1000);
        })
        .withFailureHandler(error => {
          dateRequestInFlight = false;
          document.querySelectorAll('#publicDateSelect, #publicDateToday').forEach(control => {
            control.disabled = false;
          });
          showToast(error && error.message ? error.message : '公開紀錄載入失敗，請稍後再試。', 3000);
        })
        .getPublicWallDataForClient(
          DATA.viewer && DATA.viewer.uid || '',
          DATA.viewer && DATA.viewer.sig || '',
          date,
        );
    }

    function refreshDateView() {
      const dateLabel = formatDateLabel(selectedDate);
      document.getElementById('heroDate').textContent = `${dateLabel}・只顯示本人主動公開的內容`;
      document.getElementById('publicCount').textContent = number(DATA.summary && DATA.summary.publicCount);
      document.getElementById('completedCount').textContent = number(DATA.summary && DATA.summary.completedCount);
      document.getElementById('rankingCount').textContent = number(DATA.summary && DATA.summary.rankingCount);
      document.getElementById('publicCountLabel').textContent = `${dateLabel}公開`;
      document.getElementById('completedCountLabel').textContent = `${dateLabel}已完成`;
      document.getElementById('rankingCountLabel').textContent = `${dateLabel}排行`;
      document.getElementById('recordsTab').textContent = '公開紀錄';
      document.getElementById('streaksTab').textContent = '連續排行';
      document.getElementById('updated').textContent = `更新時間：${DATA.generatedAt || ''}`;
      initDatePicker();
    }

    function shiftDate(baseDate, daysAgo) {
      const matched = String(baseDate || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!matched) return '';
      const date = new Date(Date.UTC(Number(matched[1]), Number(matched[2]) - 1, Number(matched[3])));
      date.setUTCDate(date.getUTCDate() - Math.max(0, Number(daysAgo) || 0));
      return date.toISOString().slice(0, 10);
    }

    function formatDateLabel(date) {
      const matched = String(date || '').match(/^\d{4}-(\d{2})-(\d{2})$/);
      return matched ? `${matched[1]}/${matched[2]}` : String(date || '');
    }

    function switchTab(tab) {
      const showRecords = tab === 'records';
      const recordsTab = document.getElementById('recordsTab');
      const streaksTab = document.getElementById('streaksTab');
      recordsPanel.hidden = !showRecords;
      streaksPanel.hidden = showRecords;
      recordsTab.classList.toggle('active', showRecords);
      streaksTab.classList.toggle('active', !showRecords);
      recordsTab.setAttribute('aria-selected', String(showRecords));
      streaksTab.setAttribute('aria-selected', String(!showRecords));
    }

    document.getElementById('recordsTab').addEventListener('click', () => switchTab('records'));
    document.getElementById('streaksTab').addEventListener('click', () => switchTab('streaks'));

    /**
     * 收合時只顯示名字與熱量，點開才載入餐別與食物細項。
     * 用原生的 details/summary，鍵盤與螢幕閱讀器都能直接操作。
     */
    function renderRecords() {
      const records = Array.isArray(DATA.records) ? DATA.records : [];
      if (!records.length) {
        recordsPanel.innerHTML = '<div class="empty">這天還沒有公開紀錄。<br>每個人的公開設定預設都是關閉的。</div>';
        return;
      }

      recordsPanel.innerHTML = records.map(record => {
        const intake = Math.max(0, Number(record.intake || 0));
        const allowance = Math.max(0, Number(record.allowance || 0));
        const hasAllowance = allowance > 0;
        const ratio = hasAllowance ? Math.min(100, Math.round(intake / allowance * 100)) : 0;
        const over = hasAllowance && intake > allowance;

        const kcal = hasAllowance
          ? '<span class="kcal">' + number(intake) + '<small> / ' + number(allowance) + '</small></span>'
          : '<span class="kcal">' + number(intake) + '<small> kcal</small></span>';

        return [
          '<details class="person">',
            '<summary>',
              '<div class="person-row">',
                '<span class="dot ' + (record.isComplete ? 'complete' : '') + '" aria-hidden="true"></span>',
                '<span class="person-name">' + escapeHtml(record.alias) + '</span>',
                kcal,
                likeButtonHtml(record),
                '<span class="chevron" aria-hidden="true">▼</span>',
              '</div>',
              hasAllowance
                ? '<div class="bar ' + (over ? 'over' : '') + '"><span style="width:' + ratio + '%"></span></div>'
                : '',
            '</summary>',
            '<div class="person-body">',
              personMetaHtml(record, hasAllowance),
              foodDetailsHtml(record),
            '</div>',
          '</details>',
        ].join('');
      }).join('');
    }

    function personMetaHtml(record, hasAllowance) {
      const meals = Array.isArray(record.meals) && record.meals.length
        ? record.meals.join('、')
        : '尚未記錄餐點';
      const parts = [
        (record.isComplete ? '✅ 已完成' : '📝 打卡中') + '・已記錄：' + escapeHtml(meals),
        hasAllowance ? '' : '今日額度待設定',
        '最後更新 ' + escapeHtml(record.updatedAt || '—'),
      ].filter(Boolean);
      const bmr = Math.max(0, Number(record.bmr || 0));
      const exerciseKcal = Math.max(0, Number(record.exerciseKcal || 0));
      const tdeeEstimate = Math.max(0, Number(record.tdeeEstimate || 0));
      const energyLine = bmr > 0
        ? '<div class="energy-line">⚡ BMR ' + number(bmr) + ' × 1.2 ＋運動 ' + number(exerciseKcal) + ' ＝ ' + number(tdeeEstimate || Math.round(bmr * 1.2 + exerciseKcal)) + ' kcal <small>TDEE 估算</small></div>'
        : (exerciseKcal > 0 ? '<div class="energy-line">⚡ 運動消耗 ' + number(exerciseKcal) + ' kcal</div>' : '');
      return '<div class="person-meta">' + parts.join('<br>') + energyLine + '</div>';
    }

    function foodDetailsHtml(record) {
      const mealDetails = Array.isArray(record.mealDetails)
        ? record.mealDetails.filter(meal => meal && Array.isArray(meal.items) && meal.items.length)
        : [];
      if (!mealDetails.length) {
        return '<div class="no-details">這位夥伴沒有公開食物細項。</div>';
      }

      return mealDetails.map(meal => {
        const items = meal.items.map(item => {
          const quantity = Math.max(0, Number(item.quantity || 0));
          const meta = [];
          if (item.portion) meta.push(String(item.portion));
          if (quantity > 1) meta.push('×' + formatQuantity(quantity));
          return '<div class="food-item">'
            + '<div class="food-name">' + escapeHtml(item.name || '未命名食物')
            + (meta.length ? '<span class="food-meta">' + escapeHtml(meta.join('・')) + '</span>' : '')
            + '</div>'
            + '<div class="food-kcal">' + number(item.calories) + ' kcal</div>'
            + '</div>';
        }).join('');
        return '<section class="meal-group">'
          + '<div class="meal-title">' + escapeHtml(meal.label || '餐點') + '</div>'
          + items
          + '</section>';
      }).join('');
    }

    function renderStreaks() {
      const streaks = Array.isArray(DATA.streaks) ? DATA.streaks : [];
      if (!streaks.length) {
        streaksPanel.innerHTML = '<div class="empty">還沒有人選擇參加公開連續打卡排行。</div>';
        return;
      }
      streaksPanel.innerHTML = '<div class="rank-card">' + streaks.map((item, index) => {
        const place = ['🥇', '🥈', '🥉'][index] || String(index + 1);
        return '<div class="rank-row">'
          + '<div class="place">' + place + '</div>'
          + '<div class="rank-name">' + escapeHtml(item.alias) + '</div>'
          + '<div class="streak">' + number(item.streak) + ' 天<small>' + (item.completedOnDate ? selectedDateLabel + '已完成' : selectedDateLabel + '尚未完成') + '</small></div>'
          + likeButtonHtml(item)
          + '</div>';
      }).join('') + '</div>';
    }

    function likeButtonHtml(item) {
      const actionLabel = item.likedByViewer ? '再點一次收回讚' : '送出鼓勵讚';
      return '<button class="like-button ' + (item.likedByViewer ? 'liked' : '')
        + '" type="button" data-like-key="' + escapeAttr(item.likeKey) + '" '
        + 'aria-label="' + actionLabel + '" title="' + actionLabel + '" '
        + (canToggleLike(item) ? '' : 'disabled') + '>'
        + '👍 <span class="like-count">' + number(item.likeCount) + '</span></button>';
    }

    function canToggleLike(item) {
      return Boolean(
        DATA.viewer
        && DATA.viewer.canLike
        && !likeRequestInFlight
        && !item.isSelf
      );
    }

    function allItems() {
      return []
        .concat(Array.isArray(DATA.records) ? DATA.records : [])
        .concat(Array.isArray(DATA.streaks) ? DATA.streaks : []);
    }

    /**
     * 按讚後只更新按鈕本身，不重建整個面板。
     * 舊版每按一次讚會重繪四次，代價是已展開的細項會被收起來、
     * 剛按的按鈕失去焦點、長清單還會跳動——按讚不該有這些副作用。
     */
    function applyLikeState() {
      const items = allItems();
      document.querySelectorAll('[data-like-key]').forEach(button => {
        const key = button.getAttribute('data-like-key') || '';
        const item = items.find(entry => entry.likeKey === key);
        if (!item) return;
        const actionLabel = item.likedByViewer ? '再點一次收回讚' : '送出鼓勵讚';
        button.classList.toggle('liked', Boolean(item.likedByViewer));
        button.disabled = !canToggleLike(item);
        button.setAttribute('aria-label', actionLabel);
        button.title = actionLabel;
        const count = button.querySelector('.like-count');
        if (count) count.textContent = number(item.likeCount);
      });
      updateLikeHint();
    }

    recordsPanel.addEventListener('click', handleLikeClick);
    streaksPanel.addEventListener('click', handleLikeClick);

    function handleLikeClick(event) {
      const button = event.target.closest('[data-like-key]');
      if (!button) return;
      // 讚按鈕在 summary 裡面，不擋住的話按讚會順便把卡片展開或收合。
      event.preventDefault();
      event.stopPropagation();
      if (button.disabled || likeRequestInFlight) return;

      const targetKey = button.getAttribute('data-like-key') || '';
      const items = allItems();
      const item = items.find(entry => entry.likeKey === targetKey);
      if (!item) return;

      // 同一個人可能同時出現在兩個頁籤，兩邊都要一起更新。
      const matchedItems = items.filter(entry => entry.likeKey === targetKey);
      const previousItems = matchedItems.map(entry => ({
        entry,
        likeCount: Number(entry.likeCount || 0),
        likedByViewer: Boolean(entry.likedByViewer),
      }));
      const wasLiked = Boolean(item.likedByViewer);
      const delta = wasLiked ? -1 : 1;

      // 先更新畫面，不用等 Apps Script 冷啟動與工作表寫入完成。
      likeRequestInFlight = true;
      matchedItems.forEach(entry => {
        entry.likeCount = Math.max(0, Number(entry.likeCount || 0) + delta);
        entry.likedByViewer = !wasLiked;
      });
      DATA.viewer.usedLikes = Math.max(0, Number(DATA.viewer.usedLikes || 0) + delta);
      DATA.viewer.remainingLikes = null;
      applyLikeState();
      showToast(wasLiked ? '↩️ 已收回' : '👍 已送出', 900);

      google.script.run
        .withSuccessHandler(result => {
          likeRequestInFlight = false;
          matchedItems.forEach(entry => {
            entry.likeCount = Number(result.likeCount || 0);
            entry.likedByViewer = Boolean(result.liked);
          });
          DATA.viewer.usedLikes = Number(result.usedLikes || 0);
          DATA.viewer.remainingLikes = null;
          applyLikeState();
        })
        .withFailureHandler(error => {
          likeRequestInFlight = false;
          previousItems.forEach(previous => {
            previous.entry.likeCount = previous.likeCount;
            previous.entry.likedByViewer = previous.likedByViewer;
          });
          DATA.viewer.usedLikes = Math.max(0, Number(DATA.viewer.usedLikes || 0) - delta);
          DATA.viewer.remainingLikes = null;
          applyLikeState();
          showToast(error && error.message ? error.message : '按讚失敗，請稍後再試。', 2800);
        })
        .likePublicParticipant({
          uid: DATA.viewer && DATA.viewer.uid || '',
          sig: DATA.viewer && DATA.viewer.sig || '',
          targetKey,
          date: selectedDate,
        });
    }

    function showToast(message, duration) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), Number(duration || 1400));
    }

    function updateLikeHint() {
      if (DATA.viewer && DATA.viewer.canLike) {
        likeHint.textContent = `可以按超多人讚`;
        return;
      }
      likeHint.textContent = '想按讚嗎？請回 LINE 對機器人輸入「公開紀錄」，再由它提供的連結開啟。';
    }

    function number(value) { return Math.max(0, Math.round(Number(value || 0))).toLocaleString('zh-TW'); }
    function formatQuantity(value) {
      const quantity = Math.max(0, Number(value || 0));
      return Number.isInteger(quantity) ? String(quantity) : quantity.toFixed(1).replace(/\.0$/, '');
    }
    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[char]);
    }
    function escapeAttr(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }

    renderRecords();
    renderStreaks();
    updateLikeHint();
  </script>
</body>
</html>
